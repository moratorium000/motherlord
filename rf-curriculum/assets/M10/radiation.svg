  <line x1="768" y1="278" x2="784" y2="278" stroke="#777" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M 776 94 L 776 278" fill="none" stroke="#777" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ak)"/>
  <text x="770" y="190" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="9.6" text-anchor="end" fill="#777" font-weight="normal">L / 2</text>
  <text x="560.0" y="418" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="11" text-anchor="middle" fill="#c0392b" font-weight="bold">Radiation happens when the current cannot return along a nearby opposite conductor.</text>
  <text x="560.0" y="438" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="10" text-anchor="middle" fill="#555" font-weight="normal">That is also why an unintended slot in a ground plane radiates - see M17.</text>
  <text x="560.0" y="458" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="9.6" text-anchor="middle" fill="#777" font-weight="normal">L here means the wavelength, so the dipole is half a wavelength long.</text>
</svg>
