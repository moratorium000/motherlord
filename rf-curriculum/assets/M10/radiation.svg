  <path d="M 208 144 L 208 228" fill="none" stroke="#0072B2" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ab)"/>
  <path d="M 234 144 L 234 228" fill="none" stroke="#0072B2" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ab)"/>
  <text x="178" y="260" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="9.6" text-anchor="middle" fill="#0072B2" font-weight="normal">field is trapped between the wires</text>
  <text x="178" y="276" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="9.6" text-anchor="middle" fill="#666" font-weight="normal">almost nothing radiates</text>
  <text x="380" y="90" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="11.5" text-anchor="start" fill="#1a1a1a" font-weight="bold">(b) Bend the ends outward</text>
