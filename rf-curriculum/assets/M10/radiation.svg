  <text x="560.0" y="30" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="bold">How a current on a wire becomes a radio wave</text>
  <text x="60" y="90" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="11.5" text-anchor="start" fill="#1a1a1a" font-weight="bold">(a) Open two-wire line</text>
