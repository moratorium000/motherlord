<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" width="1120" height="470" role="img" aria-label="전류가 전파가 되는 과정 — 평행 2선에서 반파장 다이폴까지">
  <title>전류가 전파가 되는 과정 — 평행 2선에서 반파장 다이폴까지</title>
  <rect width="1120" height="470" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/></marker>
