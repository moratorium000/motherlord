  <text x="498" y="292" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="9.6" text-anchor="middle" fill="#c0392b" font-weight="normal">the field starts to escape</text>
  <text x="736" y="90" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="11.5" text-anchor="start" fill="#1a1a1a" font-weight="bold">(c) Half-wave dipole</text>
  <circle cx="884" cy="186" r="13" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M 877 186 q 3.5 -6 7 0 q 3.5 6 7 0" fill="none" stroke="#1a1a1a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
