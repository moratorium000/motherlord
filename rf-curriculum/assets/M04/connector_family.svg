    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0072B2"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#009E73"/></marker>
  </defs>
  <text x="440.0" y="28" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold">RF connector families and mating compatibility</text>
  <circle cx="112" cy="130" r="46.800000000000004" fill="none" stroke="#1a1a1a" stroke-width="2.2"/>
  <circle cx="112" cy="130" r="37.800000000000004" fill="#EAF2F8" stroke="#D9A066" stroke-width="2.0"/>
  <circle cx="112" cy="130" r="4.5" fill="#D9A066" stroke="#1a1a1a" stroke-width="1.4"/>
  <text x="112" y="72.19999999999999" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="12" text-anchor="middle" fill="#1a1a1a" font-weight="bold">SMA</text>
  <text x="112" y="191.8" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="9.5" text-anchor="middle" fill="#666" font-weight="normal">up to 18 GHz</text>
  <text x="112" y="205.8" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="9" text-anchor="middle" fill="#999" font-weight="normal">outer dia 4.2 mm</text>
  <circle cx="268" cy="130" r="40.5" fill="none" stroke="#1a1a1a" stroke-width="2.2"/>
  <circle cx="268" cy="130" r="31.5" fill="#EAF2F8" stroke="#0072B2" stroke-width="2.0"/>
  <circle cx="268" cy="130" r="4.5" fill="#0072B2" stroke="#1a1a1a" stroke-width="1.4"/>
  <text x="268" y="78.5" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="12" text-anchor="middle" fill="#1a1a1a" font-weight="bold">3.5 mm</text>
  <text x="268" y="185.5" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="9.5" text-anchor="middle" fill="#666" font-weight="normal">up to 26.5 GHz</text>
  <text x="268" y="199.5" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="9" text-anchor="middle" fill="#999" font-weight="normal">outer dia 3.5 mm</text>
  <circle cx="412" cy="130" r="35.28" fill="none" stroke="#1a1a1a" stroke-width="2.2"/>
  <circle cx="412" cy="130" r="26.28" fill="#EAF2F8" stroke="#009E73" stroke-width="2.0"/>
  <circle cx="412" cy="130" r="4.5" fill="#009E73" stroke="#1a1a1a" stroke-width="1.4"/>
  <text x="412" y="83.72" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="12" text-anchor="middle" fill="#1a1a1a" font-weight="bold">2.92 mm</text>
  <text x="412" y="180.28" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="9.5" text-anchor="middle" fill="#666" font-weight="normal">up to 40 GHz</text>
  <text x="412" y="194.28" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="9" text-anchor="middle" fill="#999" font-weight="normal">outer dia 2.92 mm</text>
  <circle cx="606" cy="130" r="30.599999999999998" fill="none" stroke="#1a1a1a" stroke-width="2.2"/>
  <circle cx="606" cy="130" r="21.599999999999998" fill="#EAF2F8" stroke="#E69F00" stroke-width="2.0"/>
  <circle cx="606" cy="130" r="4.5" fill="#E69F00" stroke="#1a1a1a" stroke-width="1.4"/>
  <text x="606" y="88.4" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="12" text-anchor="middle" fill="#1a1a1a" font-weight="bold">2.4 mm</text>
  <text x="606" y="175.6" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="9.5" text-anchor="middle" fill="#666" font-weight="normal">up to 50 GHz</text>
  <text x="606" y="189.6" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="9" text-anchor="middle" fill="#999" font-weight="normal">outer dia 2.4 mm</text>
  <circle cx="748" cy="130" r="25.650000000000002" fill="none" stroke="#1a1a1a" stroke-width="2.2"/>
  <circle cx="748" cy="130" r="16.650000000000002" fill="#EAF2F8" stroke="#CC79A7" stroke-width="2.0"/>
  <circle cx="748" cy="130" r="4.5" fill="#CC79A7" stroke="#1a1a1a" stroke-width="1.4"/>
  <text x="748" y="93.35" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="12" text-anchor="middle" fill="#1a1a1a" font-weight="bold">1.85 mm</text>
  <text x="748" y="170.65" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="9.5" text-anchor="middle" fill="#666" font-weight="normal">up to 67 GHz</text>
  <text x="748" y="184.65" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="9" text-anchor="middle" fill="#999" font-weight="normal">outer dia 1.85 mm</text>
  <path d="M 112 236 L 412 236" fill="none" stroke="#009E73" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 4"/>
  <path d="M 606 236 L 748 236" fill="none" stroke="#009E73" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 4"/>
  <circle cx="112" cy="236" r="5" fill="#009E73" stroke="#009E73" stroke-width="1"/>
  <circle cx="268" cy="236" r="5" fill="#009E73" stroke="#009E73" stroke-width="1"/>
