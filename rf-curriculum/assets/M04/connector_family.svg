  <circle cx="606" cy="236" r="5" fill="#009E73" stroke="#009E73" stroke-width="1"/>
  <circle cx="748" cy="236" r="5" fill="#009E73" stroke="#009E73" stroke-width="1"/>
  <text x="262" y="258" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="10" text-anchor="middle" fill="#009E73" font-weight="bold">GROUP A - mate with each other (with care)</text>
  <text x="677" y="258" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="10" text-anchor="middle" fill="#009E73" font-weight="bold">GROUP B - mate with each other</text>
  <text x="509" y="206" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="10.5" text-anchor="middle" fill="#c0392b" font-weight="bold">DO NOT MATE</text>
  <path d="M 483 220 L 535 252" fill="none" stroke="#c0392b" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 483 252 L 535 220" fill="none" stroke="#c0392b" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="30" y="296" width="820" height="92" rx="6" fill="#FDF0EE" stroke="#c0392b" stroke-width="2"/>
  <text x="46" y="316" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="11" text-anchor="start" fill="#c0392b" font-weight="bold">KEY RULES:</text>
  <text x="46" y="336" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="10" text-anchor="start" fill="#1a1a1a" font-weight="normal">1. Group A and Group B are DELIBERATELY incompatible. The threads almost catch - forcing them destroys both.</text>
  <text x="46" y="355" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="10" text-anchor="start" fill="#1a1a1a" font-weight="normal">2. Within a group, the cheaper part limits performance and the precision part is the one that gets damaged.</text>
  <text x="46" y="374" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="10" text-anchor="start" fill="#1a1a1a" font-weight="normal">3. N-type, BNC, TNC, SMP are separate families. Torque differs by body material - see Appendix D.</text>
</svg>
