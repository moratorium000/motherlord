<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 432" width="880" height="432" role="img" aria-label="RF 커넥터 계열과 결합 호환성: SMA, 3.5 mm, 2.92 mm, 2.4 mm">
  <title>RF 커넥터 계열과 결합 호환성: SMA, 3.5 mm, 2.92 mm, 2.4 mm</title>
  <rect width="880" height="432" fill="#ffffff"/>
