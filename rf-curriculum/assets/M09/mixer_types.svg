  <text x="374" y="212" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="8.4" text-anchor="start" fill="#777" font-weight="normal">(centre tap)</text>
  <text x="300" y="270" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="9.4" text-anchor="start" fill="#555" font-weight="normal">a balun drives two diodes</text>
  <text x="300" y="286" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="9.4" text-anchor="start" fill="#555" font-weight="normal">in opposite phase, so the LO</text>
  <text x="300" y="302" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="9.4" text-anchor="start" fill="#009E73" font-weight="normal">cancels at the IF port.</text>
  <text x="300" y="318" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="9.4" text-anchor="start" fill="#009E73" font-weight="normal">LO-to-IF isolation: good</text>
