  <line x1="898" y1="316" x2="966" y2="316" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <text x="972" y="320" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="10.5" text-anchor="start" fill="#1a1a1a" font-weight="bold">IF</text>
  <text x="928" y="332" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="8.6" text-anchor="start" fill="#777" font-weight="normal">(centre tap)</text>
  <text x="596" y="376" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="9.4" text-anchor="start" fill="#555" font-weight="normal">two baluns + four diodes</text>
  <text x="596" y="392" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="9.4" text-anchor="start" fill="#009E73" font-weight="normal">all three ports isolated</text>
  <text x="596" y="408" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="9.4" text-anchor="start" fill="#009E73" font-weight="normal">even-order spurs suppressed</text>
  <text x="596" y="424" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="9.4" text-anchor="start" fill="#c0392b" font-weight="normal">needs the most LO drive power</text>
  <text x="596" y="450" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="8.8" text-anchor="start" fill="#777" font-weight="normal">the small arc is a wire hop: those two wires</text>
  <text x="596" y="464" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="8.8" text-anchor="start" fill="#777" font-weight="normal">cross without touching</text>
