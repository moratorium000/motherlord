  <text x="303" y="557" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="9.4" text-anchor="middle" fill="#1a1a1a" font-weight="normal">90 deg</text>
  <text x="303" y="571" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="9.4" text-anchor="middle" fill="#1a1a1a" font-weight="normal">combine</text>
  <line x1="332" y1="562" x2="376" y2="562" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <text x="382" y="566" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="10.5" text-anchor="start" fill="#1a1a1a" font-weight="bold">IF</text>
  <text x="211" y="670" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="9.2" text-anchor="middle" fill="#777" font-weight="normal">the LO is split 0 / 90 deg and fed to the two mixers</text>
  <text x="456" y="528" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="10.2" text-anchor="start" fill="#009E73" font-weight="bold">the wanted signal adds in phase; the image cancels.</text>
  <text x="456" y="548" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="10.2" text-anchor="start" fill="#555" font-weight="normal">typical rejection 20-35 dB, set by amplitude and phase balance.</text>
  <text x="456" y="568" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="9.8" text-anchor="start" fill="#555" font-weight="normal">1 deg of phase error, or 0.2 dB of amplitude error,</text>
  <text x="456" y="588" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="9.8" text-anchor="start" fill="#555" font-weight="normal">already caps rejection at roughly 40 dB.</text>
  <text x="456" y="608" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="10.2" text-anchor="start" fill="#c0392b" font-weight="bold">so it does NOT replace the RF filter - it relaxes it.</text>
</svg>
