  <text x="194" y="154" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="10.5" text-anchor="start" fill="#1a1a1a" font-weight="bold">IF</text>
  <text x="56" y="242" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="9.4" text-anchor="start" fill="#555" font-weight="normal">one diode - cheapest</text>
  <text x="56" y="258" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="9.4" text-anchor="start" fill="#c0392b" font-weight="normal">no port isolation at all;</text>
  <text x="56" y="274" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="9.4" text-anchor="start" fill="#c0392b" font-weight="normal">LO leaks straight to RF and IF</text>
  <text x="56" y="290" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="9.4" text-anchor="start" fill="#c0392b" font-weight="normal">all spur orders present</text>
  <text x="300" y="84" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="12" text-anchor="start" fill="#1a1a1a" font-weight="bold">(b) Single-balanced</text>
