  <text x="550.0" y="30" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Mixer topologies - what each one buys you</text>
  <text x="56" y="84" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="12" text-anchor="start" fill="#1a1a1a" font-weight="bold">(a) Single-ended</text>
  <line x1="56" y1="150" x2="110" y2="150" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <text x="58" y="126" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="9.4" text-anchor="start" fill="#0072B2" font-weight="normal">RF and LO</text>
  <text x="58" y="139" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="9.4" text-anchor="start" fill="#0072B2" font-weight="normal">share ONE port</text>
