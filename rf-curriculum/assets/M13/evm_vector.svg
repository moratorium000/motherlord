<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470" role="img" aria-label="오차 벡터(EVM)의 정의와 성분 분해">
  <title>오차 벡터(EVM)의 정의와 성분 분해</title>
  <rect width="940" height="470" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0072B2"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#009E73"/></marker>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#E69F00"/></marker>
  </defs>
  <text x="470.0" y="32" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="bold">What the error vector actually is</text>
  <path d="M 260 300 L 530 300" fill="none" stroke="#999" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ak)"/>
  <text x="544" y="304" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="12" text-anchor="start" fill="#1a1a1a" font-weight="bold">I</text>
  <path d="M 300 340 L 300 70" fill="none" stroke="#999" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ak)"/>
  <text x="296" y="56" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="12" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Q</text>
  <line x1="346" y1="296" x2="346" y2="304" stroke="#BBB" stroke-width="1" stroke-linecap="round"/>
  <line x1="296" y1="254" x2="304" y2="254" stroke="#BBB" stroke-width="1" stroke-linecap="round"/>
  <line x1="392" y1="296" x2="392" y2="304" stroke="#BBB" stroke-width="1" stroke-linecap="round"/>
  <line x1="296" y1="208" x2="304" y2="208" stroke="#BBB" stroke-width="1" stroke-linecap="round"/>
  <line x1="438" y1="296" x2="438" y2="304" stroke="#BBB" stroke-width="1" stroke-linecap="round"/>
  <line x1="296" y1="162" x2="304" y2="162" stroke="#BBB" stroke-width="1" stroke-linecap="round"/>
  <line x1="484" y1="296" x2="484" y2="304" stroke="#BBB" stroke-width="1" stroke-linecap="round"/>
  <line x1="296" y1="116" x2="304" y2="116" stroke="#BBB" stroke-width="1" stroke-linecap="round"/>
  <path d="M 300 300 L 450 150" fill="none" stroke="#0072B2" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ab)"/>
  <circle cx="450" cy="150" r="5.5" fill="#0072B2" stroke="#0072B2" stroke-width="2"/>
  <text x="390" y="124" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="10.5" text-anchor="middle" fill="#0072B2" font-weight="bold">ideal symbol</text>
  <text x="390" y="138" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="9.6" text-anchor="middle" fill="#0072B2" font-weight="normal">(reference)</text>
  <line x1="416" y1="130" x2="442" y2="144" stroke="#0072B2" stroke-width="1.1" stroke-linecap="round"/>
  <path d="M 300 300 L 508 204" fill="none" stroke="#1a1a1a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ak)"/>
  <circle cx="508" cy="204" r="5.5" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="2"/>
  <text x="514" y="240" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="10.5" text-anchor="middle" fill="#1a1a1a" font-weight="bold">measured symbol</text>
  <line x1="510" y1="228" x2="508" y2="214" stroke="#1a1a1a" stroke-width="1.1" stroke-linecap="round"/>
  <path d="M 450 150 L 508 204" fill="none" stroke="#c0392b" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)"/>
  <text x="536" y="128" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="11.5" text-anchor="middle" fill="#c0392b" font-weight="bold">error vector</text>
  <line x1="520" y1="136" x2="484" y2="166" stroke="#c0392b" stroke-width="1.1" stroke-linecap="round"/>
  <line x1="508" y1="204" x2="508" y2="150" stroke="#c0392b" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="4 3"/>
  <line x1="450" y1="150" x2="508" y2="150" stroke="#c0392b" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="4 3"/>
  <text x="479.0" y="142" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="9.4" text-anchor="middle" fill="#c0392b" font-weight="normal">magnitude error</text>
  <text x="518" y="181.0" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="9.4" text-anchor="start" fill="#c0392b" font-weight="normal">phase error</text>
  <text x="400" y="334" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="9.2" text-anchor="middle" fill="#888" font-weight="normal">(the error is drawn much larger than it really is)</text>
  <rect x="600" y="96" width="300" height="250" rx="8" fill="#F4F7FA" stroke="#C9D4DE" stroke-width="1.4"/>
  <text x="618" y="126" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="11" text-anchor="start" fill="#1a1a1a" font-weight="bold">EVM of one symbol</text>
  <text x="618" y="145" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="10.4" text-anchor="start" fill="#1a1a1a" font-weight="normal">|error vector| / |reference|</text>
  <text x="618" y="177.4" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="11" text-anchor="start" fill="#1a1a1a" font-weight="bold">EVM (RMS) over many symbols</text>
  <text x="618" y="196.4" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="10.4" text-anchor="start" fill="#1a1a1a" font-weight="normal">sqrt( mean |err|^2 / mean |ref|^2 )</text>
  <text x="618" y="228.8" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="11" text-anchor="start" fill="#009E73" font-weight="bold">in dB</text>
  <text x="618" y="247.8" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="10.4" text-anchor="start" fill="#009E73" font-weight="normal">EVM[dB] = 20 log10( EVM )</text>
  <text x="618" y="280.2" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="11" text-anchor="start" fill="#c0392b" font-weight="bold">and therefore</text>
  <text x="618" y="299.2" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="11.6" text-anchor="start" fill="#c0392b" font-weight="bold">SNR[dB] = - EVM[dB]</text>
  <text x="750" y="364" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="9.6" text-anchor="middle" fill="#666" font-weight="normal">the reference is what SHOULD have been sent</text>
  <text x="470.0" y="428" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="10.6" text-anchor="middle" fill="#c0392b" font-weight="bold">Beware: some instruments normalise by the AVERAGE power, others by the PEAK.</text>
  <text x="470.0" y="448" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="10" text-anchor="middle" fill="#555" font-weight="normal">For 64-QAM the peak-normalised number is about 3.7 dB smaller. Always check which one a datasheet quotes.</text>
</svg>
