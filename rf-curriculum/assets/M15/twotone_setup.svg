<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="560" viewBox="0 0 1060 560" font-family="Helvetica,Arial,sans-serif"><title>2-tone IP3 측정 셋업</title><rect width="1060" height="560" fill="white"/>
<defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker></defs>
<text x="530.0" y="34" font-size="16" fill="#1A1A1A" text-anchor="middle" font-weight="bold">Two-tone IP3 setup - every part is there for a reason</text>
<rect x="40" y="84" width="130" height="52" rx="5" fill="white" stroke="#1A1A1A" stroke-width="2"/><text x="105.0" y="115.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="bold">SIGNAL GEN 1</text>
<line x1="170" y1="110" x2="220" y2="110" stroke="#1A1A1A" stroke-width="2.0" marker-end="url(#ak)"/>
<rect x="220" y="86" width="90" height="48" rx="5" fill="white" stroke="#D55E00" stroke-width="2"/><text x="265.0" y="115.0" font-size="12.5" fill="#D55E00" text-anchor="middle" font-weight="bold">AMP</text>
<line x1="310" y1="110" x2="356" y2="110" stroke="#1A1A1A" stroke-width="2.0" marker-end="url(#ak)"/>
<rect x="356" y="86" width="90" height="48" rx="5" fill="white" stroke="#009E73" stroke-width="2"/><text x="401.0" y="115.0" font-size="12.5" fill="#009E73" text-anchor="middle" font-weight="bold">LPF</text>
<line x1="446" y1="110" x2="492" y2="110" stroke="#1A1A1A" stroke-width="2.0" marker-end="url(#ak)"/>
<rect x="492" y="86" width="78" height="48" rx="5" fill="white" stroke="#0072B2" stroke-width="2"/><text x="531.0" y="108.0" font-size="12.5" fill="#0072B2" text-anchor="middle" font-weight="bold">6 dB</text><text x="531.0" y="125.0" font-size="10" fill="#7F7F7F" text-anchor="middle" font-weight="normal">pad</text>
<line x1="570" y1="110" x2="620" y2="110" stroke="#1A1A1A" stroke-width="2.0" marker-end="url(#ak)"/>
<text x="105" y="74" font-size="11" fill="#7F7F7F" text-anchor="middle" font-weight="normal">f1</text>
<rect x="40" y="184" width="130" height="52" rx="5" fill="white" stroke="#1A1A1A" stroke-width="2"/><text x="105.0" y="215.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="bold">SIGNAL GEN 2</text>
<line x1="170" y1="210" x2="220" y2="210" stroke="#1A1A1A" stroke-width="2.0" marker-end="url(#ak)"/>
<rect x="220" y="186" width="90" height="48" rx="5" fill="white" stroke="#D55E00" stroke-width="2"/><text x="265.0" y="215.0" font-size="12.5" fill="#D55E00" text-anchor="middle" font-weight="bold">AMP</text>
<line x1="310" y1="210" x2="356" y2="210" stroke="#1A1A1A" stroke-width="2.0" marker-end="url(#ak)"/>
<rect x="356" y="186" width="90" height="48" rx="5" fill="white" stroke="#009E73" stroke-width="2"/><text x="401.0" y="215.0" font-size="12.5" fill="#009E73" text-anchor="middle" font-weight="bold">LPF</text>
<line x1="446" y1="210" x2="492" y2="210" stroke="#1A1A1A" stroke-width="2.0" marker-end="url(#ak)"/>
<rect x="492" y="186" width="78" height="48" rx="5" fill="white" stroke="#0072B2" stroke-width="2"/><text x="531.0" y="208.0" font-size="12.5" fill="#0072B2" text-anchor="middle" font-weight="bold">6 dB</text><text x="531.0" y="225.0" font-size="10" fill="#7F7F7F" text-anchor="middle" font-weight="normal">pad</text>
<line x1="570" y1="210" x2="620" y2="210" stroke="#1A1A1A" stroke-width="2.0" marker-end="url(#ak)"/>
<text x="105" y="174" font-size="11" fill="#7F7F7F" text-anchor="middle" font-weight="normal">f2</text>
<rect x="620" y="84" width="110" height="152" rx="5" fill="white" stroke="#1A1A1A" stroke-width="2"/><text x="675.0" y="165.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="bold">COMBINER</text>
<text x="675" y="216" font-size="11" fill="#1A1A1A" text-anchor="middle" font-weight="normal"></text>
<line x1="730" y1="160" x2="790" y2="160" stroke="#1A1A1A" stroke-width="2.0" marker-end="url(#ak)"/>
<rect x="790" y="136" width="110" height="48" rx="5" fill="white" stroke="#0072B2" stroke-width="2"/><text x="845.0" y="165.0" font-size="12.5" fill="#0072B2" text-anchor="middle" font-weight="bold">DUT</text>
<line x1="900" y1="160" x2="950" y2="160" stroke="#1A1A1A" stroke-width="2.0"/>
<rect x="950" y="136" width="90" height="48" rx="5" fill="white" stroke="#C0392B" stroke-width="2"/><text x="995.0" y="165.0" font-size="12.5" fill="#C0392B" text-anchor="middle" font-weight="bold">ATT</text>
<text x="995" y="210" font-size="12" fill="#1A1A1A" text-anchor="middle" font-weight="bold">-> SA</text>
<text x="50" y="284" font-size="13" fill="#1A1A1A" text-anchor="start" font-weight="bold">why each part is there</text>
<rect x="50" y="300" width="14" height="14" rx="2" fill="#D55E00"/>
<text x="74" y="312" font-size="11.5" fill="#D55E00" text-anchor="start" font-weight="bold">AMP</text>
<text x="210" y="312" font-size="11" fill="#7F7F7F" text-anchor="start" font-weight="normal">raises the level so the pads and combiner can be afforded</text>
<rect x="50" y="330" width="14" height="14" rx="2" fill="#009E73"/>
<text x="74" y="342" font-size="11.5" fill="#009E73" text-anchor="start" font-weight="bold">LPF</text>
<text x="210" y="342" font-size="11" fill="#7F7F7F" text-anchor="start" font-weight="normal">generator harmonics as low as -60 dBc still spoil an IM3 reading</text>
<rect x="50" y="360" width="14" height="14" rx="2" fill="#0072B2"/>
<text x="74" y="372" font-size="11.5" fill="#0072B2" text-anchor="start" font-weight="bold">6 dB PAD</text>
<text x="210" y="372" font-size="11" fill="#7F7F7F" text-anchor="start" font-weight="normal">the two big reasons a two-tone test goes wrong are generator interaction and mismatch</text>
<rect x="50" y="390" width="14" height="14" rx="2" fill="#1A1A1A"/>
<text x="74" y="402" font-size="11.5" fill="#1A1A1A" text-anchor="start" font-weight="bold">COMBINER</text>
<text x="210" y="402" font-size="11" fill="#7F7F7F" text-anchor="start" font-weight="normal">a tee is not a combiner - it creates mismatch and lets the generators pull each other</text>
<rect x="50" y="420" width="14" height="14" rx="2" fill="#C0392B"/>
<text x="74" y="432" font-size="11.5" fill="#C0392B" text-anchor="start" font-weight="bold">ATT before SA</text>
<text x="210" y="432" font-size="11" fill="#7F7F7F" text-anchor="start" font-weight="normal">so the analyser is not the thing making the IM3 you are reading</text>
<text x="50" y="478" font-size="11.5" fill="#C0392B" text-anchor="start" font-weight="bold">amp + 6 dB pads + combiner give roughly 70 dB of isolation between the two generators.</text>
<text x="50" y="500" font-size="11.5" fill="#C0392B" text-anchor="start" font-weight="normal">check first with the DUT replaced by a through: whatever IM3 you still see is the test set's own.</text>
</svg>