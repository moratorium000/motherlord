<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" font-family="Helvetica,Arial,sans-serif"><title>Y 계수법 잡음지수 측정 셋업</title><rect width="1000" height="520" fill="white"/>
<defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker></defs>
<text x="500.0" y="34" font-size="16" fill="#1A1A1A" text-anchor="middle" font-weight="bold">Y-factor noise figure measurement</text>
<rect x="60" y="96" width="150" height="68" rx="5" fill="white" stroke="#009E73" stroke-width="2"/><text x="135.0" y="128.0" font-size="12.5" fill="#009E73" text-anchor="middle" font-weight="bold">NOISE SOURCE</text><text x="135.0" y="145.0" font-size="10" fill="#7F7F7F" text-anchor="middle" font-weight="normal">ENR 15.2 dB</text>
<line x1="210" y1="130" x2="300" y2="130" stroke="#1A1A1A" stroke-width="2.0" marker-end="url(#ak)"/>
<rect x="300" y="96" width="150" height="68" rx="5" fill="white" stroke="#0072B2" stroke-width="2"/><text x="375.0" y="128.0" font-size="12.5" fill="#0072B2" text-anchor="middle" font-weight="bold">DUT</text><text x="375.0" y="145.0" font-size="10" fill="#7F7F7F" text-anchor="middle" font-weight="normal">the amplifier</text>
<line x1="450" y1="130" x2="560" y2="130" stroke="#1A1A1A" stroke-width="2.0" marker-end="url(#ak)"/>
<rect x="560" y="96" width="190" height="68" rx="5" fill="white" stroke="#1A1A1A" stroke-width="2"/><text x="655.0" y="128.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="bold">NF ANALYSER</text><text x="655.0" y="145.0" font-size="10" fill="#7F7F7F" text-anchor="middle" font-weight="normal">or SA + preamp</text>
<line x1="750" y1="130" x2="840" y2="130" stroke="#1A1A1A" stroke-width="2.0"/>
<rect x="840" y="108" width="110" height="44" rx="5" fill="#EFEFEF" stroke="#1A1A1A" stroke-width="2"/><text x="895.0" y="135.0" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="bold">READ Y</text>
<text x="135" y="192" font-size="9.8" fill="#009E73" text-anchor="middle" font-weight="normal">the ENR figure on this</text><text x="135" y="206" font-size="9.8" fill="#009E73" text-anchor="middle" font-weight="normal">sticker is the root of</text><text x="135" y="220" font-size="9.8" fill="#009E73" text-anchor="middle" font-weight="normal">the whole measurement</text><text x="135" y="234" font-size="9.8" fill="#009E73" text-anchor="middle" font-weight="normal">-> keep it calibrated</text>
<text x="375" y="192" font-size="9.8" fill="#0072B2" text-anchor="middle" font-weight="normal">must be well matched.</text><text x="375" y="206" font-size="9.8" fill="#0072B2" text-anchor="middle" font-weight="normal">the source impedance</text><text x="375" y="220" font-size="9.8" fill="#0072B2" text-anchor="middle" font-weight="normal">changes between hot</text><text x="375" y="234" font-size="9.8" fill="#0072B2" text-anchor="middle" font-weight="normal">and cold states</text>
<text x="655" y="192" font-size="9.8" fill="#1A1A1A" text-anchor="middle" font-weight="normal">its own noise figure is</text><text x="655" y="206" font-size="9.8" fill="#1A1A1A" text-anchor="middle" font-weight="normal">measured first, then</text><text x="655" y="220" font-size="9.8" fill="#1A1A1A" text-anchor="middle" font-weight="normal">subtracted (second-stage)</text>
<path d="M 100,72 l 0,-16 l 22,0 l 0,16 l 22,0 l 0,-16 l 22,0" stroke="#009E73" stroke-width="2" fill="none"/>
<text x="175" y="68" font-size="10" fill="#009E73" text-anchor="start" font-weight="normal">28 V on / off</text>
<line x1="40" y1="296" x2="960" y2="296" stroke="#7F7F7F" stroke-width="1" stroke-dasharray="5 4"/>
<text x="60" y="322" font-size="12.5" fill="#C0392B" text-anchor="start" font-weight="bold">STEP 1   calibrate : noise source straight into the analyser, no DUT</text>
<text x="60" y="342" font-size="11" fill="#7F7F7F" text-anchor="start" font-weight="normal">         -> gives the analyser's own noise figure and gain</text>
<text x="60" y="376" font-size="12.5" fill="#C0392B" text-anchor="start" font-weight="bold">STEP 2   measure : put the DUT back in</text>
<text x="60" y="396" font-size="11" fill="#7F7F7F" text-anchor="start" font-weight="normal">         -> the analyser subtracts step 1 and reports the DUT alone</text>
<text x="60" y="438" font-size="13" fill="#1A1A1A" text-anchor="start" font-weight="bold">F = ENR / (Y - 1)          Y = (noise out, source hot) / (noise out, source cold)</text>
<text x="60" y="464" font-size="11" fill="#C0392B" text-anchor="start" font-weight="normal">a large Y is a comfortable measurement.  Y below about 1 dB means the two readings are nearly the same and noise takes over.</text>
</svg>