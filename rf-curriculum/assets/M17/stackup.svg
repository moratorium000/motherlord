<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="640" viewBox="0 0 1180 640" font-family="Helvetica,Arial,sans-serif"><title>스택업 단면 - 4층과 하이브리드 6층</title><rect width="1180" height="640" fill="white"/><defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E69F00"/></marker></defs><text x="590.0" y="30" font-size="16" fill="#1A1A1A" text-anchor="middle" font-weight="bold">Stack-up: where the 50 ohm reference plane sits</text><text x="190.0" y="74" font-size="13" fill="#1A1A1A" text-anchor="middle" font-weight="bold">4-layer, general purpose</text><text x="190.0" y="91" font-size="10" fill="#7F7F7F" text-anchor="middle" font-weight="normal">all FR-4, RF on L1</text><rect x="60" y="100" width="260" height="22" rx="0" fill="#B87333" stroke="#1A1A1A" stroke-width="1.2"/><text x="70" y="115.0" font-size="10.5" fill="white" text-anchor="start" font-weight="bold">L1  signal / RF</text><line x1="324" y1="111.0" x2="336" y2="111.0" stroke="#7F7F7F" stroke-width="1.0"/><text x="340" y="115.0" font-size="9.5" fill="#7F7F7F" text-anchor="start" font-weight="normal">50 ohm microstrip</text><rect x="60" y="122" width="260" height="34" rx="0" fill="#DCE9F5" stroke="#1A1A1A" stroke-width="1.2"/><text x="70" y="143.0" font-size="10.5" fill="#1A1A1A" text-anchor="start" font-weight="normal">prepreg  0.20 mm</text><line x1="324" y1="139.0" x2="336" y2="139.0" stroke="#7F7F7F" stroke-width="1.0"/><text x="340" y="143.0" font-size="9.5" fill="#7F7F7F" text-anchor="start" font-weight="normal">this gap sets the width</text><rect x="60" y="156" width="260" height="22" rx="0" fill="#B87333" stroke="#1A1A1A" stroke-width="1.2"/><text x="70" y="171.0" font-size="10.5" fill="white" text-anchor="start" font-weight="bold">L2  GROUND (solid)</text><line x1="324" y1="167.0" x2="336" y2="167.0" stroke="#7F7F7F" stroke-width="1.0"/><text x="340" y="171.0" font-size="9.5" fill="#7F7F7F" text-anchor="start" font-weight="normal">reference - never split</text><rect x="60" y="178" width="260" height="78" rx="0" fill="#C7DCEF" stroke="#1A1A1A" stroke-width="1.2"/><text x="70" y="221.0" font-size="10.5" fill="#1A1A1A" text-anchor="start" font-weight="normal">core  1.00 mm</text><line x1="324" y1="217.0" x2="336" y2="217.0" stroke="#7F7F7F" stroke-width="1.0"/><text x="340" y="221.0" font-size="9.5" fill="#7F7F7F" text-anchor="start" font-weight="normal">thick filler</text><rect x="60" y="256" width="260" height="22" rx="0" fill="#B87333" stroke="#1A1A1A" stroke-width="1.2"/><text x="70" y="271.0" font-size="10.5" fill="white" text-anchor="start" font-weight="bold">L3  power</text><rect x="60" y="278" width="260" height="34" rx="0" fill="#DCE9F5" stroke="#1A1A1A" stroke-width="1.2"/><text x="70" y="299.0" font-size="10.5" fill="#1A1A1A" text-anchor="start" font-weight="normal">prepreg  0.20 mm</text><rect x="60" y="312" width="260" height="22" rx="0" fill="#B87333" stroke="#1A1A1A" stroke-width="1.2"/><text x="70" y="327.0" font-size="10.5" fill="white" text-anchor="start" font-weight="bold">L4  ground / signal</text><line x1="60" y1="362" x2="320" y2="362" stroke="#7F7F7F" stroke-width="1.1" marker-start="url(#ak)" marker-end="url(#ak)"/><text x="190.0" y="376" font-size="10" fill="#7F7F7F" text-anchor="middle" font-weight="normal">board 1.60 mm</text><text x="190" y="400" font-size="10.5" fill="#C0392B" text-anchor="middle" font-weight="normal">cheap. the RF layer pays FR-4 loss.</text><text x="765.0" y="74" font-size="13" fill="#1A1A1A" text-anchor="middle" font-weight="bold">hybrid 6-layer</text><text x="765.0" y="91" font-size="10" fill="#7F7F7F" text-anchor="middle" font-weight="normal">Rogers on top only</text><rect x="640" y="100" width="250" height="20" rx="0" fill="#B87333" stroke="#1A1A1A" stroke-width="1.2"/><text x="650" y="114.0" font-size="10.5" fill="white" text-anchor="start" font-weight="bold">L1  RF  (Rogers)</text><line x1="894" y1="110.0" x2="906" y2="110.0" stroke="#7F7F7F" stroke-width="1.0"/><text x="910" y="114.0" font-size="9.5" fill="#7F7F7F" text-anchor="start" font-weight="normal">low loss where it matters</text><rect x="640" y="120" width="250" height="26" rx="0" fill="#DCE9F5" stroke="#1A1A1A" stroke-width="1.2"/><text x="650" y="137.0" font-size="10.5" fill="#1A1A1A" text-anchor="start" font-weight="normal">RO4350B  0.508 mm</text><line x1="894" y1="133.0" x2="906" y2="133.0" stroke="#7F7F7F" stroke-width="1.0"/><text x="910" y="137.0" font-size="9.5" fill="#7F7F7F" text-anchor="start" font-weight="normal">Dk 3.66   Df 0.0037</text><rect x="640" y="146" width="250" height="20" rx="0" fill="#B87333" stroke="#1A1A1A" stroke-width="1.2"/><text x="650" y="160.0" font-size="10.5" fill="white" text-anchor="start" font-weight="bold">L2  GROUND (solid)</text><line x1="894" y1="156.0" x2="906" y2="156.0" stroke="#7F7F7F" stroke-width="1.0"/><text x="910" y="160.0" font-size="9.5" fill="#7F7F7F" text-anchor="start" font-weight="normal">the RF reference plane</text><rect x="640" y="166" width="250" height="34" rx="0" fill="#C7DCEF" stroke="#1A1A1A" stroke-width="1.2"/><text x="650" y="187.0" font-size="10.5" fill="#1A1A1A" text-anchor="start" font-weight="normal">FR-4 core</text><line x1="894" y1="183.0" x2="906" y2="183.0" stroke="#7F7F7F" stroke-width="1.0"/><text x="910" y="187.0" font-size="9.5" fill="#7F7F7F" text-anchor="start" font-weight="normal">cheap filler - no RF below here</text><rect x="640" y="200" width="250" height="18" rx="0" fill="#B87333" stroke="#1A1A1A" stroke-width="1.2"/><text x="650" y="213.0" font-size="10.5" fill="white" text-anchor="start" font-weight="bold">L3  digital</text><rect x="640" y="218" width="250" height="24" rx="0" fill="#DCE9F5" stroke="#1A1A1A" stroke-width="1.2"/><text x="650" y="234.0" font-size="10.5" fill="#1A1A1A" text-anchor="start" font-weight="normal">FR-4 prepreg</text><rect x="640" y="242" width="250" height="18" rx="0" fill="#B87333" stroke="#1A1A1A" stroke-width="1.2"/><text x="650" y="255.0" font-size="10.5" fill="white" text-anchor="start" font-weight="bold">L4  power</text><rect x="640" y="260" width="250" height="34" rx="0" fill="#C7DCEF" stroke="#1A1A1A" stroke-width="1.2"/><text x="650" y="281.0" font-size="10.5" fill="#1A1A1A" text-anchor="start" font-weight="normal">FR-4 core</text><rect x="640" y="294" width="250" height="18" rx="0" fill="#B87333" stroke="#1A1A1A" stroke-width="1.2"/><text x="650" y="307.0" font-size="10.5" fill="white" text-anchor="start" font-weight="bold">L5  ground</text><rect x="640" y="312" width="250" height="24" rx="0" fill="#DCE9F5" stroke="#1A1A1A" stroke-width="1.2"/><text x="650" y="328.0" font-size="10.5" fill="#1A1A1A" text-anchor="start" font-weight="normal">FR-4 prepreg</text><rect x="640" y="336" width="250" height="18" rx="0" fill="#B87333" stroke="#1A1A1A" stroke-width="1.2"/><text x="650" y="349.0" font-size="10.5" fill="white" text-anchor="start" font-weight="bold">L6  digital / mech</text><line x1="640" y1="382" x2="890" y2="382" stroke="#7F7F7F" stroke-width="1.1" marker-start="url(#ak)" marker-end="url(#ak)"/><text x="765.0" y="396" font-size="10" fill="#7F7F7F" text-anchor="middle" font-weight="normal">board ~1.6 mm</text><text x="765" y="420" font-size="10.5" fill="#009E73" text-anchor="middle" font-weight="normal">RF gets low loss, the rest stays cheap</text><rect x="60" y="470" width="1060" height="140" rx="8" fill="#F5F9FD" stroke="#0072B2" stroke-width="1.8"/><text x="590" y="496" font-size="12.5" fill="#0072B2" text-anchor="middle" font-weight="bold">the two rules that decide a stack-up</text><text x="84" y="522" font-size="10.5" fill="#1A1A1A" text-anchor="start" font-weight="normal">1   the layer directly under an RF trace must be a SOLID ground plane. Not power, not a split plane, not a gap.</text><text x="84" y="544" font-size="10.5" fill="#1A1A1A" text-anchor="start" font-weight="normal">2   the L1-L2 dielectric thickness sets the 50 ohm width. Thin dielectric -&gt; narrow trace -&gt; tighter coupling -&gt; less radiation and less crosstalk.</text><text x="84" y="566" font-size="10.5" fill="#1A1A1A" text-anchor="start" font-weight="normal"></text><text x="84" y="588" font-size="10.5" fill="#7F7F7F" text-anchor="start" font-weight="normal">so the usual move is: thin prepreg between L1 and L2, and a thick core underneath to make up the board thickness.</text></svg>