<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="500" viewBox="0 0 1040 500" font-family="Helvetica,Arial,sans-serif"><title>실드 캔 단면과 흡수체</title><rect width="1040" height="500" fill="white"/><defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E69F00"/></marker></defs><text x="520.0" y="30" font-size="16" fill="#1A1A1A" text-anchor="middle" font-weight="bold">Shield cans: what they fix, and what they break</text><rect x="80" y="230" width="400" height="16" rx="0" fill="#B87333" stroke="#1A1A1A" stroke-width="1.2"/><text x="280" y="292" font-size="10" fill="#7F7F7F" text-anchor="middle" font-weight="normal">PCB, ground plane under the can frame</text><path d="M 120 230 L 120 130 L 440 130 L 440 230" fill="none" stroke="#7F7F7F" stroke-width="4.0"/><text x="280" y="98" font-size="11" fill="#1A1A1A" text-anchor="middle" font-weight="bold">shield can (soldered frame + lid)</text><circle cx="120" cy="232" r="5" fill="#009E73" stroke="#1A1A1A" stroke-width="1.4"/><circle cx="160" cy="232" r="5" fill="#009E73" stroke="#1A1A1A" stroke-width="1.4"/><circle cx="200" cy="232" r="5" fill="#009E73" stroke="#1A1A1A" stroke-width="1.4"/><circle cx="240" cy="232" r="5" fill="#009E73" stroke="#1A1A1A" stroke-width="1.4"/><circle cx="280" cy="232" r="5" fill="#009E73" stroke="#1A1A1A" stroke-width="1.4"/><circle cx="320" cy="232" r="5" fill="#009E73" stroke="#1A1A1A" stroke-width="1.4"/><circle cx="360" cy="232" r="5" fill="#009E73" stroke="#1A1A1A" stroke-width="1.4"/><circle cx="400" cy="232" r="5" fill="#009E73" stroke="#1A1A1A" stroke-width="1.4"/><circle cx="440" cy="232" r="5" fill="#009E73" stroke="#1A1A1A" stroke-width="1.4"/><text x="280" y="272" font-size="10" fill="#009E73" text-anchor="middle" font-weight="bold">solder to ground every &lt; lambda/20, same rule as vias</text><rect x="150" y="182" width="62" height="34" rx="3" fill="white" stroke="#1A1A1A" stroke-width="1.5"/><text x="181" y="204" font-size="10" fill="#1A1A1A" text-anchor="middle" font-weight="bold">LNA</text><rect x="250" y="182" width="62" height="34" rx="3" fill="white" stroke="#1A1A1A" stroke-width="1.5"/><text x="281" y="204" font-size="10" fill="#1A1A1A" text-anchor="middle" font-weight="bold">MIX</text><rect x="350" y="182" width="62" height="34" rx="3" fill="white" stroke="#1A1A1A" stroke-width="1.5"/><text x="381" y="204" font-size="10" fill="#1A1A1A" text-anchor="middle" font-weight="bold">VCO</text><path d="M 140 160 Q 280 146 420 160" fill="none" stroke="#C0392B" stroke-width="2.0" stroke-dasharray="6 4"/><text x="425" y="174" font-size="10" fill="#C0392B" text-anchor="end" font-weight="bold">cavity resonance</text><rect x="140" y="134" width="280" height="12" fill="#E69F00" stroke="#1A1A1A" stroke-width="1"/><text x="280" y="116" font-size="10" fill="#E69F00" text-anchor="middle" font-weight="bold">absorber sheet on the lid inside</text><rect x="540" y="90" width="430" height="250" rx="8" fill="#F5F9FD" stroke="#0072B2" stroke-width="1.8"/><text x="755" y="116" font-size="12.5" fill="#0072B2" text-anchor="middle" font-weight="bold">the can itself resonates</text><text x="560" y="142" font-size="11" fill="#1A1A1A" text-anchor="start" font-weight="normal" font-family="Courier,monospace">f_res = (c / 2) * sqrt((m/a)^2 + (n/b)^2)</text><text x="560" y="160" font-size="10" fill="#7F7F7F" text-anchor="start" font-weight="normal">lowest mode is m = n = 1;  a, b = inside length and width</text><text x="575" y="190" font-size="10.5" fill="#1A1A1A" text-anchor="start" font-weight="normal" font-family="Courier,monospace">a = 30 mm, b = 20 mm</text><text x="800" y="190" font-size="10.5" fill="#1A1A1A" text-anchor="start" font-weight="normal" font-family="Courier,monospace">-&gt; 9.01 GHz</text><text x="575" y="212" font-size="10.5" fill="#1A1A1A" text-anchor="start" font-weight="normal" font-family="Courier,monospace">a = 60 mm, b = 45 mm</text><text x="800" y="212" font-size="10.5" fill="#1A1A1A" text-anchor="start" font-weight="normal" font-family="Courier,monospace">-&gt; 4.16 GHz</text><text x="575" y="234" font-size="10.5" fill="#1A1A1A" text-anchor="start" font-weight="normal" font-family="Courier,monospace">a = 100 mm, b = 75 mm</text><text x="800" y="234" font-size="10.5" fill="#C0392B" text-anchor="start" font-weight="normal" font-family="Courier,monospace">-&gt; 2.50 GHz</text><text x="560" y="274" font-size="10.5" fill="#C0392B" text-anchor="start" font-weight="bold">the 100 x 75 mm can resonates inside the 2.4 GHz band.</text><text x="560" y="292" font-size="10.5" fill="#1A1A1A" text-anchor="start" font-weight="normal">fixes: make it smaller, split it with an internal wall,</text><text x="560" y="310" font-size="10.5" fill="#1A1A1A" text-anchor="start" font-weight="normal">or put absorber on the lid. Measure before and after.</text><rect x="80" y="370" width="890" height="106" rx="8" fill="#F0F0F0" stroke="#1A1A1A" stroke-width="1.6"/><text x="525" y="394" font-size="12" fill="#1A1A1A" text-anchor="middle" font-weight="bold">before you reach for a can</text><text x="104" y="418" font-size="10.5" fill="#1A1A1A" text-anchor="start" font-weight="normal">a can fixes RADIATED coupling. It does nothing for coupling through the power rail or through a shared ground.</text><text x="104" y="438" font-size="10.5" fill="#C0392B" text-anchor="start" font-weight="normal">a can with too few ground contacts is worse than none - the gaps become slots.</text><text x="104" y="458" font-size="10.5" fill="#1A1A1A" text-anchor="start" font-weight="normal">a can traps heat. Check the power amplifier temperature after you fit it.</text></svg>