<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560" font-family="Helvetica,Arial,sans-serif"><title>마이크로스트립과 GCPW 치수</title><rect width="1040" height="560" fill="white"/><defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E69F00"/></marker></defs><text x="520.0" y="30" font-size="16" fill="#1A1A1A" text-anchor="middle" font-weight="bold">Microstrip vs grounded coplanar waveguide (GCPW)</text><text x="250" y="78" font-size="13" fill="#1A1A1A" text-anchor="middle" font-weight="bold">microstrip</text><rect x="70" y="130" width="360" height="60" rx="0" fill="#DCE9F5" stroke="#1A1A1A" stroke-width="1.2"/><rect x="70" y="190" width="360" height="14" rx="0" fill="#B87333" stroke="#1A1A1A" stroke-width="1.2"/><rect x="220" y="116" width="60" height="14" rx="0" fill="#B87333" stroke="#1A1A1A" stroke-width="1.2"/><text x="250" y="110" font-size="11" fill="#D55E00" text-anchor="middle" font-weight="bold">W</text><line x1="220" y1="102" x2="280" y2="102" stroke="#D55E00" stroke-width="1.1" marker-start="url(#ak)" marker-end="url(#ak)"/><text x="250.0" y="96" font-size="10" fill="#D55E00" text-anchor="middle" font-weight="normal"></text><text x="470" y="160" font-size="11" fill="#0072B2" text-anchor="start" font-weight="bold">h</text><line x1="450" y1="130" x2="450" y2="190" stroke="#0072B2" stroke-width="1.1" marker-start="url(#ab)" marker-end="url(#ab)"/><text x="250" y="201" font-size="10" fill="white" text-anchor="middle" font-weight="bold">GROUND</text><path d="M 226 120 Q 140 132 145 190" fill="none" stroke="#009E73" stroke-width="1.2" stroke-dasharray="4 3"/><path d="M 274 120 Q 360 132 355 190" fill="none" stroke="#009E73" stroke-width="1.2" stroke-dasharray="4 3"/><text x="250" y="290" font-size="10" fill="#009E73" text-anchor="middle" font-weight="normal">some field goes through air -&gt; Dk_eff is below Dk</text><text x="250" y="242" font-size="11" fill="#1A1A1A" text-anchor="middle" font-weight="bold">RO4350B  h = 0.508 mm  -&gt;  W = 1.12 mm</text><text x="250" y="260" font-size="10" fill="#7F7F7F" text-anchor="middle" font-weight="normal">easy to build, easy to probe</text><text x="780" y="78" font-size="13" fill="#1A1A1A" text-anchor="middle" font-weight="bold">GCPW  (grounded coplanar waveguide)</text><rect x="600" y="130" width="360" height="60" rx="0" fill="#DCE9F5" stroke="#1A1A1A" stroke-width="1.2"/><rect x="658" y="116" width="8" height="88" fill="#B87333" stroke="#1A1A1A" stroke-width="0.9"/><rect x="688" y="116" width="8" height="88" fill="#B87333" stroke="#1A1A1A" stroke-width="0.9"/><rect x="718" y="116" width="8" height="88" fill="#B87333" stroke="#1A1A1A" stroke-width="0.9"/><rect x="834" y="116" width="8" height="88" fill="#B87333" stroke="#1A1A1A" stroke-width="0.9"/><rect x="864" y="116" width="8" height="88" fill="#B87333" stroke="#1A1A1A" stroke-width="0.9"/><rect x="894" y="116" width="8" height="88" fill="#B87333" stroke="#1A1A1A" stroke-width="0.9"/><rect x="600" y="190" width="360" height="14" rx="0" fill="#B87333" stroke="#1A1A1A" stroke-width="1.2"/><rect x="640" y="116" width="100" height="14" rx="0" fill="#B87333" stroke="#1A1A1A" stroke-width="1.2"/><rect x="820" y="116" width="100" height="14" rx="0" fill="#B87333" stroke="#1A1A1A" stroke-width="1.2"/><rect x="768" y="116" width="24" height="14" rx="0" fill="#B87333" stroke="#1A1A1A" stroke-width="1.2"/><text x="690" y="108" font-size="10" fill="#7F7F7F" text-anchor="middle" font-weight="normal">GND pour</text><text x="870" y="108" font-size="10" fill="#7F7F7F" text-anchor="middle" font-weight="normal">GND pour</text><text x="780" y="156" font-size="11" fill="#D55E00" text-anchor="middle" font-weight="bold">W</text><line x1="768" y1="142" x2="792" y2="142" stroke="#D55E00" stroke-width="1.1" marker-start="url(#ak)" marker-end="url(#ak)"/><text x="780.0" y="136" font-size="10" fill="#D55E00" text-anchor="middle" font-weight="normal"></text><text x="754" y="156" font-size="11" fill="#C0392B" text-anchor="middle" font-weight="bold">G</text><text x="806" y="156" font-size="11" fill="#C0392B" text-anchor="middle" font-weight="bold">G</text><line x1="740" y1="142" x2="768" y2="142" stroke="#C0392B" stroke-width="1.1" marker-start="url(#ak)" marker-end="url(#ak)"/><text x="754.0" y="136" font-size="10" fill="#C0392B" text-anchor="middle" font-weight="normal"></text><line x1="792" y1="142" x2="820" y2="142" stroke="#C0392B" stroke-width="1.1" marker-start="url(#ak)" marker-end="url(#ak)"/><text x="806.0" y="136" font-size="10" fill="#C0392B" text-anchor="middle" font-weight="normal"></text><text x="780" y="201" font-size="10" fill="white" text-anchor="middle" font-weight="bold">GROUND</text><text x="780" y="224" font-size="9.5" fill="#7F7F7F" text-anchor="middle" font-weight="normal">stitching vias tie the pours to the plane below</text><path d="M 766 120 Q 752 106 740 120" fill="none" stroke="#009E73" stroke-width="1.6"/><path d="M 794 120 Q 808 106 820 120" fill="none" stroke="#009E73" stroke-width="1.6"/><text x="780" y="290" font-size="10" fill="#009E73" text-anchor="middle" font-weight="normal">field is trapped in the gap - that is why GCPW isolates better</text><text x="780" y="242" font-size="11" fill="#1A1A1A" text-anchor="middle" font-weight="bold">50 ohm comes from W and G together</text><text x="780" y="260" font-size="10" fill="#C0392B" text-anchor="middle" font-weight="normal">no stitching vias -&gt; it is not GCPW, it is a slot</text><rect x="70" y="320" width="900" height="130" rx="8" fill="#F0F0F0" stroke="#1A1A1A" stroke-width="1.6"/><text x="520" y="344" font-size="12" fill="#1A1A1A" text-anchor="middle" font-weight="bold">which one</text><text x="96" y="370" font-size="11.5" fill="#0072B2" text-anchor="start" font-weight="bold">microstrip</text><text x="210" y="370" font-size="10.5" fill="#1A1A1A" text-anchor="start" font-weight="normal">below ~6 GHz, plenty of room, components sit on the line</text><text x="210" y="385" font-size="10" fill="#7F7F7F" text-anchor="start" font-weight="normal">fewer vias, forgiving to build</text><text x="96" y="408" font-size="11.5" fill="#0072B2" text-anchor="start" font-weight="bold">GCPW</text><text x="210" y="408" font-size="10.5" fill="#1A1A1A" text-anchor="start" font-weight="normal">above ~6 GHz, dense layout, next to a noisy block, IC fan-out</text><text x="210" y="423" font-size="10" fill="#7F7F7F" text-anchor="start" font-weight="normal">needs the side ground AND the stitching vias to work</text><text x="520" y="470" font-size="11" fill="#C0392B" text-anchor="middle" font-weight="bold">the gap G matters as much as the width W - change one and the impedance moves</text><text x="520" y="496" font-size="10.5" fill="#7F7F7F" text-anchor="middle" font-weight="normal">never copy a GCPW dimension without its gap and its via pitch</text></svg>