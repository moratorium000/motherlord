<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="580" viewBox="0 0 1060 580" font-family="Helvetica,Arial,sans-serif"><title>리턴 패스 - 정상과 단절</title><rect width="1060" height="580" fill="white"/><defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E69F00"/></marker></defs><text x="530.0" y="30" font-size="16" fill="#1A1A1A" text-anchor="middle" font-weight="bold">The return current, seen from above</text><text x="530.0" y="52" font-size="11" fill="#7F7F7F" text-anchor="middle" font-weight="normal">every signal current comes back. the only question is by which route.</text><rect x="50" y="82" width="430" height="276" rx="8" fill="#FAFCFA" stroke="#009E73" stroke-width="2.2"/><text x="265.0" y="72" font-size="13" fill="#009E73" text-anchor="middle" font-weight="bold">solid ground plane</text><rect x="74" y="116" width="382" height="168" rx="2" fill="#EBCBA9" stroke="#B87333" stroke-width="1.6"/><text x="265.0" y="134" font-size="9.5" fill="#7F7F7F" text-anchor="middle" font-weight="normal">GROUND PLANE  (layer 2, seen through the board)</text><line x1="94" y1="194" x2="436" y2="194" stroke="#0072B2" stroke-width="4.0" marker-end="url(#ab)"/><path d="M 436 203 L 94 203" fill="none" stroke="#D55E00" stroke-width="3.0" stroke-dasharray="7 4" marker-end="url(#ao)"/><text x="265.0" y="182" font-size="10.5" fill="#0072B2" text-anchor="middle" font-weight="bold">signal, layer 1</text><text x="265.0" y="222" font-size="10.5" fill="#D55E00" text-anchor="middle" font-weight="bold">return, layer 2, right underneath</text><text x="265.0" y="270" font-size="10.5" fill="#1A1A1A" text-anchor="middle" font-weight="bold">no loop area worth speaking of</text><text x="265.0" y="310" font-size="10" fill="#1A1A1A" text-anchor="middle" font-weight="normal">the two currents lie on top of each other, 0.2 mm apart.</text><text x="265.0" y="330" font-size="10" fill="#009E73" text-anchor="middle" font-weight="bold">the loop they enclose is a thin ribbon - it barely radiates.</text><rect x="580" y="82" width="430" height="276" rx="8" fill="#FDF6F5" stroke="#C0392B" stroke-width="2.2"/><text x="795.0" y="72" font-size="13" fill="#C0392B" text-anchor="middle" font-weight="bold">the plane is split</text><rect x="604" y="116" width="382" height="168" rx="2" fill="#EBCBA9" stroke="#B87333" stroke-width="1.6"/><text x="620" y="134" font-size="9.5" fill="#7F7F7F" text-anchor="start" font-weight="normal">GROUND PLANE with a SLOT</text><rect x="680" y="194" width="230" height="56" fill="#C0392B" opacity="0.17"/><rect x="786" y="116" width="16" height="130" fill="white" stroke="#C0392B" stroke-width="1.8" stroke-dasharray="5 4"/><text x="794" y="108" font-size="10" fill="#C0392B" text-anchor="middle" font-weight="bold">slot</text><line x1="624" y1="194" x2="966" y2="194" stroke="#0072B2" stroke-width="4.0" marker-end="url(#ab)"/><path d="M 966 203 L 910 203 L 910 246 L 680 246 L 680 203 L 624 203" fill="none" stroke="#D55E00" stroke-width="3.0" stroke-dasharray="7 4" marker-end="url(#ao)"/><text x="795.0" y="182" font-size="10.5" fill="#0072B2" text-anchor="middle" font-weight="bold">signal crosses the slot</text><text x="732" y="228" font-size="10" fill="#C0392B" text-anchor="middle" font-weight="bold">loop area</text><text x="795.0" y="272" font-size="10.5" fill="#D55E00" text-anchor="middle" font-weight="bold">the return goes round the slot end</text><text x="795.0" y="310" font-size="10" fill="#1A1A1A" text-anchor="middle" font-weight="normal">the loop now encloses real area.</text><text x="795.0" y="330" font-size="10" fill="#C0392B" text-anchor="middle" font-weight="bold">that area is an antenna - it radiates out, and it picks up.</text><rect x="50" y="396" width="960" height="138" rx="8" fill="#F0F0F0" stroke="#1A1A1A" stroke-width="1.6"/><text x="530" y="422" font-size="12.5" fill="#1A1A1A" text-anchor="middle" font-weight="bold">the rule that saves the most boards</text><text x="74" y="448" font-size="10.5" fill="#1A1A1A" text-anchor="start" font-weight="normal">1   every RF trace needs an UNBROKEN reference plane directly beneath it, along its whole length.</text><text x="74" y="470" font-size="10.5" fill="#1A1A1A" text-anchor="start" font-weight="normal">2   do not split the ground plane. A split is a slot, and a slot the signal has to jump is a slot antenna.</text><text x="74" y="492" font-size="10.5" fill="#1A1A1A" text-anchor="start" font-weight="normal">3   when a signal changes layer, put a GROUND via right next to the signal via - the return needs a way through too.</text><text x="74" y="514" font-size="10.5" fill="#1A1A1A" text-anchor="start" font-weight="normal">4   the same applies to a plane broken by a row of connector holes, or by a wide gap between two pours.</text></svg>