<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" font-family="Helvetica,Arial,sans-serif"><title>배치 구획 - RF / 디지털 / 전원 분리</title><rect width="1040" height="620" fill="white"/><defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E69F00"/></marker></defs><text x="520.0" y="30" font-size="16" fill="#1A1A1A" text-anchor="middle" font-weight="bold">Floor plan: decide this before you route a single trace</text><rect x="60" y="60" width="700" height="420" rx="8" fill="#FCFCFC" stroke="#1A1A1A" stroke-width="2.2"/><text x="72" y="78" font-size="10" fill="#7F7F7F" text-anchor="start" font-weight="normal">board outline</text><rect x="80" y="100" width="300" height="200" rx="6" fill="#FDF3EC" stroke="#D55E00" stroke-width="1.8"/><text x="230.0" y="120" font-size="11.5" fill="#D55E00" text-anchor="middle" font-weight="bold">RF FRONT END</text><text x="230.0" y="137" font-size="9.5" fill="#7F7F7F" text-anchor="middle" font-weight="normal">antenna - filter - LNA/PA - mixer</text><rect x="74" y="160" width="52" height="30" rx="3" fill="white" stroke="#1A1A1A" stroke-width="1.5"/><text x="100" y="180" font-size="10" fill="#1A1A1A" text-anchor="middle" font-weight="bold">ANT</text><rect x="144" y="160" width="52" height="30" rx="3" fill="white" stroke="#1A1A1A" stroke-width="1.5"/><text x="170" y="180" font-size="10" fill="#1A1A1A" text-anchor="middle" font-weight="bold">FILT</text><line x1="126" y1="175" x2="144" y2="175" stroke="#D55E00" stroke-width="2.0" marker-end="url(#ao)"/><rect x="214" y="160" width="52" height="30" rx="3" fill="white" stroke="#1A1A1A" stroke-width="1.5"/><text x="240" y="180" font-size="10" fill="#1A1A1A" text-anchor="middle" font-weight="bold">LNA</text><line x1="196" y1="175" x2="214" y2="175" stroke="#D55E00" stroke-width="2.0" marker-end="url(#ao)"/><rect x="284" y="160" width="52" height="30" rx="3" fill="white" stroke="#1A1A1A" stroke-width="1.5"/><text x="310" y="180" font-size="10" fill="#1A1A1A" text-anchor="middle" font-weight="bold">MIX</text><line x1="266" y1="175" x2="284" y2="175" stroke="#D55E00" stroke-width="2.0" marker-end="url(#ao)"/><text x="230" y="228" font-size="10" fill="#D55E00" text-anchor="middle" font-weight="bold">signal flows in ONE direction</text><text x="230" y="246" font-size="9.5" fill="#7F7F7F" text-anchor="middle" font-weight="normal">no folding back on itself</text><text x="230" y="270" font-size="9.5" fill="#7F7F7F" text-anchor="middle" font-weight="normal">keep this whole block on solid ground</text><rect x="420" y="100" width="310" height="200" rx="6" fill="#EEF4FA" stroke="#0072B2" stroke-width="1.8"/><text x="575.0" y="120" font-size="11.5" fill="#0072B2" text-anchor="middle" font-weight="bold">DIGITAL</text><text x="575.0" y="137" font-size="9.5" fill="#7F7F7F" text-anchor="middle" font-weight="normal">MCU - clock - memory - USB</text><text x="575" y="180" font-size="10" fill="#0072B2" text-anchor="middle" font-weight="normal">clock harmonics live here</text><text x="575" y="202" font-size="10" fill="#C0392B" text-anchor="middle" font-weight="bold">they will find your RF band</text><text x="575" y="236" font-size="9.5" fill="#7F7F7F" text-anchor="middle" font-weight="normal">route clocks AWAY from the boundary</text><text x="575" y="254" font-size="9.5" fill="#7F7F7F" text-anchor="middle" font-weight="normal">never over the RF ground</text><rect x="80" y="322" width="650" height="130" rx="6" fill="#EFF7F3" stroke="#009E73" stroke-width="1.8"/><text x="405.0" y="342" font-size="11.5" fill="#009E73" text-anchor="middle" font-weight="bold">POWER</text><text x="405.0" y="359" font-size="9.5" fill="#7F7F7F" text-anchor="middle" font-weight="normal">connector - protection - regulators - bulk caps</text><text x="405" y="382" font-size="10" fill="#1A1A1A" text-anchor="middle" font-weight="normal">feed each block on its own branch: RF rail and digital rail never share a via</text><text x="405" y="404" font-size="10" fill="#7F7F7F" text-anchor="middle" font-weight="normal">ferrite bead or LDO between the noisy rail and the quiet one</text><text x="405" y="428" font-size="10" fill="#7F7F7F" text-anchor="middle" font-weight="normal">star the returns at ONE point, or use one plane and never cut it</text><path d="M 405 100 L 405 300" fill="none" stroke="#C0392B" stroke-width="2.4" stroke-dasharray="7 5"/><text x="405" y="90" font-size="10.5" fill="#C0392B" text-anchor="middle" font-weight="bold">the boundary</text><rect x="790" y="60" width="190" height="420" rx="8" fill="#F0F0F0" stroke="#1A1A1A" stroke-width="1.6"/><text x="885" y="84" font-size="12" fill="#1A1A1A" text-anchor="middle" font-weight="bold">order of work</text><text x="806" y="110.0" font-size="10" fill="#1A1A1A" text-anchor="start" font-weight="normal">1  antenna position</text><text x="806" y="127.5" font-size="10" fill="#1A1A1A" text-anchor="start" font-weight="normal">    (it decides the rest)</text><text x="806" y="145.0" font-size="10" fill="#1A1A1A" text-anchor="start" font-weight="normal"></text><text x="806" y="162.5" font-size="10" fill="#1A1A1A" text-anchor="start" font-weight="normal">2  RF chain, straight</text><text x="806" y="180.0" font-size="10" fill="#1A1A1A" text-anchor="start" font-weight="normal">    line, shortest path</text><text x="806" y="197.5" font-size="10" fill="#1A1A1A" text-anchor="start" font-weight="normal"></text><text x="806" y="215.0" font-size="10" fill="#1A1A1A" text-anchor="start" font-weight="normal">3  the boundary between</text><text x="806" y="232.5" font-size="10" fill="#1A1A1A" text-anchor="start" font-weight="normal">    RF and digital</text><text x="806" y="250.0" font-size="10" fill="#1A1A1A" text-anchor="start" font-weight="normal"></text><text x="806" y="267.5" font-size="10" fill="#1A1A1A" text-anchor="start" font-weight="normal">4  power entry and</text><text x="806" y="285.0" font-size="10" fill="#1A1A1A" text-anchor="start" font-weight="normal">    regulators</text><text x="806" y="302.5" font-size="10" fill="#1A1A1A" text-anchor="start" font-weight="normal"></text><text x="806" y="320.0" font-size="10" fill="#1A1A1A" text-anchor="start" font-weight="normal">5  connectors and</text><text x="806" y="337.5" font-size="10" fill="#1A1A1A" text-anchor="start" font-weight="normal">    mounting holes</text><text x="806" y="355.0" font-size="10" fill="#1A1A1A" text-anchor="start" font-weight="normal"></text><text x="806" y="372.5" font-size="10" fill="#1A1A1A" text-anchor="start" font-weight="normal">6  everything else</text><text x="806" y="390.0" font-size="10" fill="#1A1A1A" text-anchor="start" font-weight="normal"></text><text x="806" y="407.5" font-size="10" fill="#C0392B" text-anchor="start" font-weight="bold"></text><text x="806" y="425.0" font-size="10" fill="#C0392B" text-anchor="start" font-weight="bold">moving a part later</text><text x="806" y="442.5" font-size="10" fill="#C0392B" text-anchor="start" font-weight="bold">costs ten times more</text><text x="806" y="460.0" font-size="10" fill="#C0392B" text-anchor="start" font-weight="bold">than placing it right</text><text x="520.0" y="520" font-size="11.5" fill="#C0392B" text-anchor="middle" font-weight="bold">the single most common failure: the RF block sits next to the switching regulator</text><text x="520.0" y="546" font-size="10.5" fill="#7F7F7F" text-anchor="middle" font-weight="normal">a buck converter at 2 MHz has harmonics that reach far past 1 GHz - give it distance and its own return</text><text x="520.0" y="578" font-size="10.5" fill="#7F7F7F" text-anchor="middle" font-weight="normal">and keep a clear keep-out around the antenna: no copper, no parts, no metal shell</text></svg>