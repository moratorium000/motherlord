<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="620" viewBox="0 0 1180 620" font-family="Helvetica,Arial,sans-serif"><title>2.4 GHz 송수신 겸용 트랜시버 블록도</title><rect width="1180" height="620" fill="white"/><defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker></defs><text x="590.0" y="30" font-size="16" fill="#1A1A1A" text-anchor="middle" font-weight="bold">2.4 GHz half-duplex transceiver - what you are building</text><text x="590.0" y="52" font-size="10.5" fill="#7F7F7F" text-anchor="middle" font-weight="normal">the numbers under each block are what YOUR budget must fill in</text><path d="M 78 285 L 78 259 M 62 259 L 94 259 M 66 251 L 90 251" fill="none" stroke="#1A1A1A" stroke-width="2.2"/><text x="78" y="303" font-size="10.5" fill="#1A1A1A" text-anchor="middle" font-weight="bold">ANT</text><text x="78" y="317" font-size="9" fill="#7F7F7F" text-anchor="middle" font-weight="normal">2 dBi</text><rect x="120" y="262" width="96" height="46" rx="4" fill="#F7F7F7" stroke="#1A1A1A" stroke-width="1.6"/><text x="168.0" y="282" font-size="11" fill="#1A1A1A" text-anchor="middle" font-weight="bold">T/R SW</text><text x="168.0" y="298" font-size="9" fill="#7F7F7F" text-anchor="middle" font-weight="normal">IL 1.0 dB</text><line x1="96" y1="285" x2="120" y2="285" stroke="#1A1A1A" stroke-width="2.0" marker-end="url(#ak)"/><rect x="232" y="110" width="830" height="118" rx="8" fill="#F5F9FD" stroke="#0072B2" stroke-width="1.8"/><text x="646" y="128" font-size="12" fill="#0072B2" text-anchor="middle" font-weight="bold">RECEIVE</text><rect x="250" y="150" width="96" height="46" rx="4" fill="white" stroke="#1A1A1A" stroke-width="1.6"/><text x="298.0" y="170" font-size="11" fill="#1A1A1A" text-anchor="middle" font-weight="bold">BPF</text><text x="298.0" y="186" font-size="9" fill="#7F7F7F" text-anchor="middle" font-weight="normal">IL 1.5 dB</text><rect x="380" y="150" width="96" height="46" rx="4" fill="#FDF3EC" stroke="#D55E00" stroke-width="1.6"/><text x="428.0" y="170" font-size="11" fill="#D55E00" text-anchor="middle" font-weight="bold">LNA</text><text x="428.0" y="186" font-size="9" fill="#7F7F7F" text-anchor="middle" font-weight="normal">G 22 / NF 0.9</text><line x1="346" y1="173.0" x2="380" y2="173.0" stroke="#0072B2" stroke-width="2.0" marker-end="url(#ab)"/><rect x="510" y="150" width="96" height="46" rx="4" fill="white" stroke="#1A1A1A" stroke-width="1.6"/><text x="558.0" y="170" font-size="11" fill="#1A1A1A" text-anchor="middle" font-weight="bold">BPF</text><text x="558.0" y="186" font-size="9" fill="#7F7F7F" text-anchor="middle" font-weight="normal">IL 1.5 dB</text><line x1="476" y1="173.0" x2="510" y2="173.0" stroke="#0072B2" stroke-width="2.0" marker-end="url(#ab)"/><rect x="640" y="150" width="96" height="46" rx="4" fill="white" stroke="#1A1A1A" stroke-width="1.6"/><text x="688.0" y="170" font-size="11" fill="#1A1A1A" text-anchor="middle" font-weight="bold">MIXER</text><text x="688.0" y="186" font-size="9" fill="#7F7F7F" text-anchor="middle" font-weight="normal">G 8 / NF 10</text><line x1="606" y1="173.0" x2="640" y2="173.0" stroke="#0072B2" stroke-width="2.0" marker-end="url(#ab)"/><rect x="770" y="150" width="96" height="46" rx="4" fill="white" stroke="#1A1A1A" stroke-width="1.6"/><text x="818.0" y="170" font-size="11" fill="#1A1A1A" text-anchor="middle" font-weight="bold">LPF</text><text x="818.0" y="186" font-size="9" fill="#7F7F7F" text-anchor="middle" font-weight="normal">IL 1.0 dB</text><line x1="736" y1="173.0" x2="770" y2="173.0" stroke="#0072B2" stroke-width="2.0" marker-end="url(#ab)"/><rect x="900" y="150" width="96" height="46" rx="4" fill="#FDF3EC" stroke="#D55E00" stroke-width="1.6"/><text x="948.0" y="170" font-size="11" fill="#D55E00" text-anchor="middle" font-weight="bold">VGA</text><text x="948.0" y="186" font-size="9" fill="#7F7F7F" text-anchor="middle" font-weight="normal">G 30 / NF 15</text><line x1="866" y1="173.0" x2="900" y2="173.0" stroke="#0072B2" stroke-width="2.0" marker-end="url(#ab)"/><rect x="1030" y="150" width="96" height="46" rx="4" fill="white" stroke="#1A1A1A" stroke-width="1.6"/><text x="1078.0" y="170" font-size="11" fill="#1A1A1A" text-anchor="middle" font-weight="bold">ADC</text><text x="1078.0" y="186" font-size="9" fill="#7F7F7F" text-anchor="middle" font-weight="normal">-&gt; baseband</text><line x1="996" y1="173.0" x2="1030" y2="173.0" stroke="#0072B2" stroke-width="2.0" marker-end="url(#ab)"/><path d="M 216 277 L 224 277 L 224 173.0 L 250 173.0" fill="none" stroke="#0072B2" stroke-width="2.2" marker-end="url(#ab)"/><text x="450" y="246" font-size="10" fill="#D55E00" text-anchor="middle" font-weight="bold">AGC switches the LNA in and out - that is how NF and IIP3</text><text x="450" y="262" font-size="10" fill="#D55E00" text-anchor="middle" font-weight="bold">are met in different modes</text><rect x="232" y="380" width="830" height="118" rx="8" fill="#EFF7F3" stroke="#009E73" stroke-width="1.8"/><text x="646" y="398" font-size="12" fill="#009E73" text-anchor="middle" font-weight="bold">TRANSMIT</text><rect x="250" y="420" width="96" height="46" rx="4" fill="white" stroke="#1A1A1A" stroke-width="1.6"/><text x="298.0" y="440" font-size="11" fill="#1A1A1A" text-anchor="middle" font-weight="bold">HPF</text><text x="298.0" y="456" font-size="9" fill="#7F7F7F" text-anchor="middle" font-weight="normal">IL 1.5 dB</text><rect x="380" y="420" width="96" height="46" rx="4" fill="#FDF3EC" stroke="#D55E00" stroke-width="1.6"/><text x="428.0" y="440" font-size="11" fill="#D55E00" text-anchor="middle" font-weight="bold">PA</text><text x="428.0" y="456" font-size="9" fill="#7F7F7F" text-anchor="middle" font-weight="normal">P1dB +32</text><line x1="380" y1="443.0" x2="346" y2="443.0" stroke="#009E73" stroke-width="2.0" marker-end="url(#ag)"/><rect x="510" y="420" width="96" height="46" rx="4" fill="white" stroke="#1A1A1A" stroke-width="1.6"/><text x="558.0" y="440" font-size="11" fill="#1A1A1A" text-anchor="middle" font-weight="bold">DRIVER</text><text x="558.0" y="456" font-size="9" fill="#7F7F7F" text-anchor="middle" font-weight="normal">G 20 dB</text><line x1="510" y1="443.0" x2="476" y2="443.0" stroke="#009E73" stroke-width="2.0" marker-end="url(#ag)"/><rect x="640" y="420" width="96" height="46" rx="4" fill="white" stroke="#1A1A1A" stroke-width="1.6"/><text x="688.0" y="440" font-size="11" fill="#1A1A1A" text-anchor="middle" font-weight="bold">MOD</text><text x="688.0" y="456" font-size="9" fill="#7F7F7F" text-anchor="middle" font-weight="normal">I/Q up-conv</text><line x1="640" y1="443.0" x2="606" y2="443.0" stroke="#009E73" stroke-width="2.0" marker-end="url(#ag)"/><rect x="770" y="420" width="96" height="46" rx="4" fill="white" stroke="#1A1A1A" stroke-width="1.6"/><text x="818.0" y="440" font-size="11" fill="#1A1A1A" text-anchor="middle" font-weight="bold">LPF</text><text x="818.0" y="456" font-size="9" fill="#7F7F7F" text-anchor="middle" font-weight="normal">reconstruct</text><line x1="770" y1="443.0" x2="736" y2="443.0" stroke="#009E73" stroke-width="2.0" marker-end="url(#ag)"/><rect x="900" y="420" width="96" height="46" rx="4" fill="white" stroke="#1A1A1A" stroke-width="1.6"/><text x="948.0" y="440" font-size="11" fill="#1A1A1A" text-anchor="middle" font-weight="bold">DAC</text><text x="948.0" y="456" font-size="9" fill="#7F7F7F" text-anchor="middle" font-weight="normal">&lt;- baseband</text><line x1="900" y1="443.0" x2="866" y2="443.0" stroke="#009E73" stroke-width="2.0" marker-end="url(#ag)"/><path d="M 250 443.0 L 242 443.0 L 242 293 L 216 293" fill="none" stroke="#009E73" stroke-width="2.2" marker-end="url(#ag)"/><text x="646" y="516" font-size="10" fill="#009E73" text-anchor="middle" font-weight="bold">PAPR 10 dB means the peak sits 10 dB above the average - that is what sets the PA</text><rect x="632" y="285" width="96" height="46" rx="4" fill="#FDF6E8" stroke="#E69F00" stroke-width="1.6"/><text x="680.0" y="305" font-size="11" fill="#E69F00" text-anchor="middle" font-weight="bold">PLL / VCO</text><text x="680.0" y="321" font-size="9" fill="#7F7F7F" text-anchor="middle" font-weight="normal">shared LO</text><path d="M 680.0 285 L 680.0 196" fill="none" stroke="#E69F00" stroke-width="1.8" stroke-dasharray="5 4"/><path d="M 680.0 331 L 680.0 420" fill="none" stroke="#E69F00" stroke-width="1.8" stroke-dasharray="5 4"/><text x="680.0" y="352" font-size="9" fill="#7F7F7F" text-anchor="middle" font-weight="normal">one reference for both</text><rect x="502" y="366" width="356" height="34" rx="6" fill="#FDF6F5" stroke="#C0392B" stroke-width="1.5"/><text x="680" y="387" font-size="10" fill="#C0392B" text-anchor="middle" font-weight="bold">40 MHz ref x 61 = 2440 MHz - inside the band. You cannot plan it away.</text><rect x="60" y="520" width="1060" height="74" rx="8" fill="#F0F0F0" stroke="#1A1A1A" stroke-width="1.6"/><text x="590" y="542" font-size="11.5" fill="#1A1A1A" text-anchor="middle" font-weight="bold">POWER  -  its own budget, and its own noise</text><text x="84" y="562" font-size="10" fill="#1A1A1A" text-anchor="start" font-weight="normal">Z_target = dV / dI    ·    the switching regulator is the loudest thing on the board    ·    RF rail separated by ferrite or its own LDO</text><text x="84" y="580" font-size="10" fill="#7F7F7F" text-anchor="start" font-weight="normal">every block above draws current; the sum has to fit the power budget, and the PA dominates it</text></svg>