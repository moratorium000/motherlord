<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" font-family="Helvetica,Arial,sans-serif"><title>캡스톤 산출물 11종과 의존 관계</title><rect width="1120" height="640" fill="white"/><defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker></defs><text x="560.0" y="30" font-size="16" fill="#1A1A1A" text-anchor="middle" font-weight="bold">Eleven deliverables - and what each one feeds</text><text x="560.0" y="52" font-size="10.5" fill="#7F7F7F" text-anchor="middle" font-weight="normal">an arrow means: you cannot write the next one without the previous</text><rect x="60" y="82" width="1000" height="108" rx="8" fill="#F5F9FD" stroke="#0072B2" stroke-width="1.8"/><text x="78" y="102" font-size="12" fill="#0072B2" text-anchor="start" font-weight="bold">P1  system design</text><rect x="84" y="110" width="236" height="62" rx="5" fill="white" stroke="#0072B2" stroke-width="1.4"/><circle cx="102" cy="128" r="12" fill="#0072B2"/><text x="102" y="132" font-size="10.5" fill="white" text-anchor="middle" font-weight="bold">1</text><text x="122" y="126" font-size="10.5" fill="#1A1A1A" text-anchor="start" font-weight="bold">requirements analysis</text><text x="122" y="142" font-size="9" fill="#7F7F7F" text-anchor="start" font-weight="normal">conflicts found and negotiated</text><rect x="342" y="110" width="236" height="62" rx="5" fill="white" stroke="#0072B2" stroke-width="1.4"/><circle cx="360" cy="128" r="12" fill="#0072B2"/><text x="360" y="132" font-size="10.5" fill="white" text-anchor="middle" font-weight="bold">2</text><text x="380" y="126" font-size="10.5" fill="#1A1A1A" text-anchor="start" font-weight="bold">RX cascade budget</text><text x="380" y="142" font-size="9" fill="#7F7F7F" text-anchor="start" font-weight="normal">NF - IIP3 - gain, per AGC mode</text><rect x="600" y="110" width="236" height="62" rx="5" fill="white" stroke="#0072B2" stroke-width="1.4"/><circle cx="618" cy="128" r="12" fill="#0072B2"/><text x="618" y="132" font-size="10.5" fill="white" text-anchor="middle" font-weight="bold">3</text><text x="638" y="126" font-size="10.5" fill="#1A1A1A" text-anchor="start" font-weight="bold">TX cascade budget</text><text x="638" y="142" font-size="9" fill="#7F7F7F" text-anchor="start" font-weight="normal">output - backoff - EVM</text><rect x="858" y="110" width="236" height="62" rx="5" fill="white" stroke="#0072B2" stroke-width="1.4"/><circle cx="876" cy="128" r="12" fill="#0072B2"/><text x="876" y="132" font-size="10.5" fill="white" text-anchor="middle" font-weight="bold">4</text><text x="896" y="126" font-size="10.5" fill="#1A1A1A" text-anchor="start" font-weight="bold">frequency plan + spur table</text><text x="896" y="142" font-size="9" fill="#7F7F7F" text-anchor="start" font-weight="normal">isolation budget, not zero</text><path d="M 560.0 190 L 560.0 206" fill="none" stroke="#7F7F7F" stroke-width="2.0" marker-end="url(#ak)"/><rect x="60" y="240" width="1000" height="108" rx="8" fill="#FDF3EC" stroke="#D55E00" stroke-width="1.8"/><text x="78" y="260" font-size="12" fill="#D55E00" text-anchor="start" font-weight="bold">P2  implementation</text><rect x="84" y="268" width="236" height="62" rx="5" fill="white" stroke="#D55E00" stroke-width="1.4"/><circle cx="102" cy="286" r="12" fill="#D55E00"/><text x="102" y="290" font-size="10.5" fill="white" text-anchor="middle" font-weight="bold">5</text><text x="122" y="284" font-size="10.5" fill="#1A1A1A" text-anchor="start" font-weight="bold">part selection rationale</text><text x="122" y="300" font-size="9" fill="#7F7F7F" text-anchor="start" font-weight="normal">datasheet -&gt; our spec</text><rect x="342" y="268" width="236" height="62" rx="5" fill="white" stroke="#D55E00" stroke-width="1.4"/><circle cx="360" cy="286" r="12" fill="#D55E00"/><text x="360" y="290" font-size="10.5" fill="white" text-anchor="middle" font-weight="bold">6</text><text x="380" y="284" font-size="10.5" fill="#1A1A1A" text-anchor="start" font-weight="bold">schematic + board files</text><text x="380" y="300" font-size="9" fill="#7F7F7F" text-anchor="start" font-weight="normal">stack-up, impedance, layout</text><path d="M 560.0 348 L 560.0 364" fill="none" stroke="#7F7F7F" stroke-width="2.0" marker-end="url(#ak)"/><rect x="60" y="356" width="1000" height="108" rx="8" fill="#EFF7F3" stroke="#009E73" stroke-width="1.8"/><text x="78" y="376" font-size="12" fill="#009E73" text-anchor="start" font-weight="bold">P3  verification</text><rect x="84" y="384" width="236" height="62" rx="5" fill="white" stroke="#009E73" stroke-width="1.4"/><circle cx="102" cy="402" r="12" fill="#009E73"/><text x="102" y="406" font-size="10.5" fill="white" text-anchor="middle" font-weight="bold">7</text><text x="122" y="400" font-size="10.5" fill="#1A1A1A" text-anchor="start" font-weight="bold">test plan</text><text x="122" y="416" font-size="9" fill="#7F7F7F" text-anchor="start" font-weight="normal">conditions - equipment - guard band</text><rect x="342" y="384" width="236" height="62" rx="5" fill="white" stroke="#009E73" stroke-width="1.4"/><circle cx="360" cy="402" r="12" fill="#009E73"/><text x="360" y="406" font-size="10.5" fill="white" text-anchor="middle" font-weight="bold">8</text><text x="380" y="400" font-size="10.5" fill="#1A1A1A" text-anchor="start" font-weight="bold">measurement report</text><text x="380" y="416" font-size="9" fill="#7F7F7F" text-anchor="start" font-weight="normal">value +/- uncertainty</text><path d="M 560.0 464 L 560.0 480" fill="none" stroke="#7F7F7F" stroke-width="2.0" marker-end="url(#ak)"/><rect x="60" y="472" width="1000" height="108" rx="8" fill="#FDF6F5" stroke="#C0392B" stroke-width="1.8"/><text x="78" y="492" font-size="12" fill="#C0392B" text-anchor="start" font-weight="bold">P4  tune - judge - report</text><rect x="84" y="500" width="236" height="62" rx="5" fill="white" stroke="#C0392B" stroke-width="1.4"/><circle cx="102" cy="518" r="12" fill="#C0392B"/><text x="102" y="522" font-size="10.5" fill="white" text-anchor="middle" font-weight="bold">9</text><text x="122" y="516" font-size="10.5" fill="#1A1A1A" text-anchor="start" font-weight="bold">tuning log</text><text x="122" y="532" font-size="9" fill="#7F7F7F" text-anchor="start" font-weight="normal">one change at a time</text><rect x="342" y="500" width="236" height="62" rx="5" fill="white" stroke="#C0392B" stroke-width="1.4"/><circle cx="360" cy="518" r="12" fill="#C0392B"/><text x="360" y="522" font-size="10.5" fill="white" text-anchor="middle" font-weight="bold">10</text><text x="380" y="516" font-size="10.5" fill="#1A1A1A" text-anchor="start" font-weight="bold">conformity statement</text><text x="380" y="532" font-size="9" fill="#7F7F7F" text-anchor="start" font-weight="normal">decision rule stated</text><rect x="600" y="500" width="236" height="62" rx="5" fill="white" stroke="#C0392B" stroke-width="1.4"/><circle cx="618" cy="518" r="12" fill="#C0392B"/><text x="618" y="522" font-size="10.5" fill="white" text-anchor="middle" font-weight="bold">11</text><text x="638" y="516" font-size="10.5" fill="#1A1A1A" text-anchor="start" font-weight="bold">design review pack</text><text x="638" y="532" font-size="9" fill="#7F7F7F" text-anchor="start" font-weight="normal">what you would do differently</text><rect x="60" y="566" width="1000" height="58" rx="8" fill="#F0F0F0" stroke="#1A1A1A" stroke-width="1.6"/><text x="560.0" y="588" font-size="11.5" fill="#1A1A1A" text-anchor="middle" font-weight="bold">the rule that decides the grade</text><text x="560.0" y="610" font-size="10.5" fill="#C0392B" text-anchor="middle" font-weight="bold">every number in every deliverable must be traceable to a datasheet, a measurement, or a calculation you can show</text></svg>