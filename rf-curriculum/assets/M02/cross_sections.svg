<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 272" width="880" height="272" role="img" aria-label="전송선로 단면 비교: 동축, 마이크로스트립, 스트립라인, 접지형 코플래너 도파관">
  <title>전송선로 단면 비교: 동축, 마이크로스트립, 스트립라인, 접지형 코플래너 도파관</title>
  <rect width="880" height="272" fill="#ffffff"/>
  <text x="440" y="26" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold" font-style="normal">Transmission line cross sections</text>
  <circle cx="108" cy="150" r="52" fill="#CFE3F0" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="108" cy="150" r="52" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>
