  <text x="380" y="56" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="12" text-anchor="middle" fill="#1a1a1a" font-weight="bold" font-style="normal">Microstrip</text>
  <rect x="320" y="120" width="120" height="40" rx="0" fill="#CFE3F0" stroke="#1a1a1a" stroke-width="1.6"/>
  <rect x="320" y="160" width="120" height="10" rx="0" fill="#D9A066" stroke="#1a1a1a" stroke-width="1.6"/>
