  <text x="380" y="203" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="9" text-anchor="middle" fill="#666" font-weight="normal" font-style="normal">fields partly in air</text>
  <text x="380" y="100" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="10" text-anchor="middle" fill="#1a1a1a" font-weight="normal" font-style="normal">W</text>
