  <rect x="805" y="120" width="6" height="40" rx="0" fill="#D9A066" stroke="#1a1a1a" stroke-width="1.0"/>
  <text x="440" y="258" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="10" text-anchor="middle" fill="#666" font-weight="normal" font-style="normal">S = signal conductor,   brown = copper,   blue = dielectric substrate</text>
