  <text x="108" y="56" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="12" text-anchor="middle" fill="#1a1a1a" font-weight="bold" font-style="normal">Coaxial</text>
  <text x="108" y="228" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="9" text-anchor="middle" fill="#666" font-weight="normal" font-style="normal">shield fully surrounds signal</text>
  <text x="108" y="241" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="9" text-anchor="middle" fill="#666" font-weight="normal" font-style="normal">no radiation</text>
