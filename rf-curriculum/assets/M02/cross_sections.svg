  <rect x="750" y="108" width="20" height="12" rx="0" fill="#D9A066" stroke="#1a1a1a" stroke-width="1.6"/>
  <rect x="698" y="108" width="38" height="12" rx="0" fill="#D9A066" stroke="#1a1a1a" stroke-width="1.6"/>
  <rect x="784" y="108" width="38" height="12" rx="0" fill="#D9A066" stroke="#1a1a1a" stroke-width="1.6"/>
