  <text x="72" y="470" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="9.8" text-anchor="start" fill="#c0392b" font-weight="bold">All three run on LINEAR ratios, not dB. Convert first, convert back at the end.</text>
  <text x="72" y="498" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="9.8" text-anchor="start" fill="#1a1a1a" font-weight="bold">cumulative gain</text>
  <text x="232" y="498" font-family='DejaVu Sans Mono, Consolas, monospace' font-size="9.8" text-anchor="start" fill="#1a1a1a" font-weight="normal">G = G1 x G2 x ...</text>
  <text x="72" y="526" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="9.8" text-anchor="start" fill="#009E73" font-weight="bold">cumulative noise factor</text>
  <text x="232" y="526" font-family='DejaVu Sans Mono, Consolas, monospace' font-size="9.8" text-anchor="start" fill="#1a1a1a" font-weight="normal">F = F1 + (F2-1)/G1 + (F3-1)/(G1 G2) + ...</text>
  <text x="72" y="554" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="9.8" text-anchor="start" fill="#c0392b" font-weight="bold">cumulative IIP3</text>
  <text x="232" y="554" font-family='DejaVu Sans Mono, Consolas, monospace' font-size="9.8" text-anchor="start" fill="#1a1a1a" font-weight="normal">1/IIP3 = 1/IIP3_1 + G1/IIP3_2 + (G1 G2)/IIP3_3 + ...</text>
  <text x="56" y="586" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="9.6" text-anchor="start" fill="#777" font-weight="normal">(100) means the part is passive, so its IIP3 is effectively infinite - it never limits linearity.</text>
