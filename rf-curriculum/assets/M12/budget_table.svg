  <text x="56" y="424" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="10.4" text-anchor="start" fill="#0072B2" font-weight="bold">cumulative columns</text>
  <text x="204" y="424" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="9.8" text-anchor="start" fill="#555" font-weight="normal">computed by the three formulas below</text>
