<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="570" viewBox="0 0 1020 570" font-family="Helvetica,Arial,sans-serif"><title>데이터시트 해부 - 어디를 봐야 하는가</title><rect width="1020" height="570" fill="white"/>
<defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker></defs>
<text x="510.0" y="32" font-size="16" fill="#1A1A1A" text-anchor="middle" font-weight="bold">Reading a datasheet: the numbers are not the point</text>
<rect x="60" y="70" width="560" height="250" rx="6" fill="white" stroke="#1A1A1A" stroke-width="2"/>
<text x="76" y="96" font-size="13" fill="#1A1A1A" text-anchor="start" font-weight="bold">LNA-2450  Electrical Specifications</text>
<text x="76" y="116" font-size="10" fill="#7F7F7F" text-anchor="start" font-weight="normal">Vdd = 5 V, Idq = 60 mA, Ta = 25 C, Z0 = 50 ohm</text>
<line x1="76" y1="126" x2="604" y2="126" stroke="#7F7F7F" stroke-width="1"/>
<text x="80" y="148" font-size="11" fill="#1A1A1A" text-anchor="start" font-weight="bold">Parameter</text>
<text x="270" y="148" font-size="11" fill="#1A1A1A" text-anchor="start" font-weight="bold">Min</text>
<text x="350" y="148" font-size="11" fill="#1A1A1A" text-anchor="start" font-weight="bold">Typ</text>
<text x="430" y="148" font-size="11" fill="#1A1A1A" text-anchor="start" font-weight="bold">Max</text>
<text x="510" y="148" font-size="11" fill="#1A1A1A" text-anchor="start" font-weight="bold">Unit</text>
<text x="80" y="174" font-size="11" fill="#1A1A1A" text-anchor="start" font-weight="normal">Frequency</text>
<text x="270" y="174" font-size="11" fill="#1A1A1A" text-anchor="start" font-weight="normal">2400</text>
<text x="350" y="174" font-size="11" fill="#C0392B" text-anchor="start" font-weight="normal">-</text>
<text x="430" y="174" font-size="11" fill="#1A1A1A" text-anchor="start" font-weight="normal">2500</text>
<text x="510" y="174" font-size="11" fill="#1A1A1A" text-anchor="start" font-weight="normal">MHz</text>
<text x="80" y="198" font-size="11" fill="#1A1A1A" text-anchor="start" font-weight="normal">Gain</text>
<text x="270" y="198" font-size="11" fill="#1A1A1A" text-anchor="start" font-weight="normal">16.5</text>
<text x="350" y="198" font-size="11" fill="#1A1A1A" text-anchor="start" font-weight="normal">18.0</text>
<text x="430" y="198" font-size="11" fill="#C0392B" text-anchor="start" font-weight="normal">-</text>
<text x="510" y="198" font-size="11" fill="#1A1A1A" text-anchor="start" font-weight="normal">dB</text>
<text x="80" y="222" font-size="11" fill="#1A1A1A" text-anchor="start" font-weight="normal">Noise figure</text>
<text x="270" y="222" font-size="11" fill="#C0392B" text-anchor="start" font-weight="normal">-</text>
<text x="350" y="222" font-size="11" fill="#1A1A1A" text-anchor="start" font-weight="normal">1.3</text>
<text x="430" y="222" font-size="11" fill="#C0392B" text-anchor="start" font-weight="normal">-</text>
<text x="510" y="222" font-size="11" fill="#1A1A1A" text-anchor="start" font-weight="normal">dB</text>
<text x="80" y="246" font-size="11" fill="#1A1A1A" text-anchor="start" font-weight="normal">OIP3</text>
<text x="270" y="246" font-size="11" fill="#1A1A1A" text-anchor="start" font-weight="normal">28</text>
<text x="350" y="246" font-size="11" fill="#1A1A1A" text-anchor="start" font-weight="normal">31</text>
<text x="430" y="246" font-size="11" fill="#C0392B" text-anchor="start" font-weight="normal">-</text>
<text x="510" y="246" font-size="11" fill="#1A1A1A" text-anchor="start" font-weight="normal">dBm</text>
<text x="80" y="270" font-size="11" fill="#1A1A1A" text-anchor="start" font-weight="normal">P1dB</text>
<text x="270" y="270" font-size="11" fill="#C0392B" text-anchor="start" font-weight="normal">-</text>
<text x="350" y="270" font-size="11" fill="#1A1A1A" text-anchor="start" font-weight="normal">19</text>
<text x="430" y="270" font-size="11" fill="#C0392B" text-anchor="start" font-weight="normal">-</text>
<text x="510" y="270" font-size="11" fill="#1A1A1A" text-anchor="start" font-weight="normal">dBm</text>
<text x="80" y="294" font-size="11" fill="#1A1A1A" text-anchor="start" font-weight="normal">Supply current</text>
<text x="270" y="294" font-size="11" fill="#C0392B" text-anchor="start" font-weight="normal">-</text>
<text x="350" y="294" font-size="11" fill="#1A1A1A" text-anchor="start" font-weight="normal">60</text>
<text x="430" y="294" font-size="11" fill="#1A1A1A" text-anchor="start" font-weight="normal">75</text>
<text x="510" y="294" font-size="11" fill="#1A1A1A" text-anchor="start" font-weight="normal">mA</text>
<rect x="330" y="208" width="60" height="20" rx="3" fill="none" stroke="#C0392B" stroke-width="2"/>
<rect x="262" y="232" width="60" height="20" rx="3" fill="none" stroke="#C0392B" stroke-width="2"/>
<path d="M 626,116 L 638,106" stroke="#C0392B" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
<text x="654" y="104" font-size="10.5" fill="#C0392B" text-anchor="start" font-weight="bold">the CONDITIONS line is the real specification</text>
<text x="654" y="119" font-size="9.5" fill="#7F7F7F" text-anchor="start" font-weight="normal">every number below is only true here</text>
<path d="M 626,222 L 638,176" stroke="#C0392B" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
<text x="654" y="174" font-size="10.5" fill="#C0392B" text-anchor="start" font-weight="bold">Typ only, no Max -&gt; NOT guaranteed</text>
<text x="654" y="189" font-size="9.5" fill="#7F7F7F" text-anchor="start" font-weight="normal">you may not design to this number</text>
<path d="M 626,246 L 638,246" stroke="#0072B2" stroke-width="1.4" fill="none" marker-end="url(#ab)"/>
<text x="654" y="244" font-size="10.5" fill="#0072B2" text-anchor="start" font-weight="bold">Min is guaranteed, Typ is not</text>
<text x="654" y="259" font-size="9.5" fill="#7F7F7F" text-anchor="start" font-weight="normal">use Min for your budget</text>
<path d="M 626,294 L 638,316" stroke="#009E73" stroke-width="1.4" fill="none" marker-end="url(#ag)"/>
<text x="654" y="314" font-size="10.5" fill="#009E73" text-anchor="start" font-weight="bold">Max supply current sizes your regulator</text>
<text x="654" y="329" font-size="9.5" fill="#7F7F7F" text-anchor="start" font-weight="normal">not the typical one</text>
<rect x="60" y="360" width="900" height="176" rx="8" fill="#F0F0F0" stroke="#7F7F7F" stroke-width="1.4"/>
<text x="80" y="386" font-size="12.5" fill="#1A1A1A" text-anchor="start" font-weight="bold">before you believe any number, find these</text>
<text x="84" y="414" font-size="11" fill="#1A1A1A" text-anchor="start" font-weight="normal">1.  the test conditions  (voltage, current, temperature, impedance)</text>
<text x="84" y="438" font-size="11" fill="#1A1A1A" text-anchor="start" font-weight="normal">2.  is it Min/Max (guaranteed) or Typ (not guaranteed)?</text>
<text x="84" y="462" font-size="11" fill="#1A1A1A" text-anchor="start" font-weight="normal">3.  over what temperature range is it guaranteed?</text>
<text x="84" y="486" font-size="11" fill="#1A1A1A" text-anchor="start" font-weight="normal">4.  the test circuit in the appendix - your board is not that board</text>
<text x="84" y="510" font-size="11" fill="#1A1A1A" text-anchor="start" font-weight="normal">5.  which revision of the datasheet is this?</text>
</svg>