  <text x="187" y="102" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="9.5" text-anchor="middle" fill="#1a1a1a" font-weight="normal">L</text>
  <text x="235" y="102" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="9.5" text-anchor="middle" fill="#1a1a1a" font-weight="normal">C</text>
  <rect x="80" y="154" width="220" height="96" rx="5" fill="#EAF2F8" stroke="#0072B2" stroke-width="1.6"/>
  <text x="190" y="176" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="11" text-anchor="middle" fill="#0072B2" font-weight="bold">at f0:  Z = R  (minimum)</text>
  <text x="190" y="196" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="10" text-anchor="middle" fill="#444" font-weight="normal">looks like a SHORT</text>
  <text x="190" y="216" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="10" text-anchor="middle" fill="#444" font-weight="normal">use: notch to ground,</text>
