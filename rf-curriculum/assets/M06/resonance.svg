  <line x1="536" y1="146" x2="536" y2="162" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <line x1="548" y1="146" x2="548" y2="162" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <line x1="548" y1="154" x2="630" y2="154" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <text x="529" y="74" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="9.5" text-anchor="middle" fill="#1a1a1a" font-weight="normal">L</text>
  <text x="542" y="182" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="9.5" text-anchor="middle" fill="#1a1a1a" font-weight="normal">C</text>
  <rect x="424" y="196" width="250" height="96" rx="5" fill="#EAF6F1" stroke="#009E73" stroke-width="1.6"/>
  <text x="549" y="218" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="11" text-anchor="middle" fill="#009E73" font-weight="bold">at f0:  Z = maximum</text>
  <text x="549" y="238" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="10" text-anchor="middle" fill="#444" font-weight="normal">looks like an OPEN</text>
  <text x="549" y="258" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="10" text-anchor="middle" fill="#444" font-weight="normal">use: tank circuit, bias choke,</text>
  <text x="549" y="274" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="10" text-anchor="middle" fill="#444" font-weight="normal">oscillator resonator</text>
  <text x="390.0" y="330" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="11.5" text-anchor="middle" fill="#1a1a1a" font-weight="bold">f0 = 1 / (2 pi sqrt(L C))   for both.   Q = f0 / BW.</text>
</svg>
