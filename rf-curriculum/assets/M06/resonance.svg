<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" width="780" height="340" role="img" aria-label="직렬 공진과 병렬 공진의 회로와 성질 비교">
  <title>직렬 공진과 병렬 공진의 회로와 성질 비교</title>
  <rect width="780" height="340" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0072B2"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#009E73"/></marker>
  </defs>
  <text x="390.0" y="28" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Series vs parallel resonance</text>
  <text x="220" y="62" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="12" text-anchor="middle" fill="#0072B2" font-weight="bold">SERIES resonance</text>
  <line x1="90" y1="120" x2="116" y2="120" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <rect x="116" y="112.0" width="34" height="16" rx="0" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="150" y1="120" x2="166" y2="120" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
