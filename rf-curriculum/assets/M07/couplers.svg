<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-label="방향성 결합기, 윌킨슨 전력 분배기, 서큘레이터의 구조와 파라미터">
  <title>방향성 결합기, 윌킨슨 전력 분배기, 서큘레이터의 구조와 파라미터</title>
  <rect width="880" height="400" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0072B2"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#009E73"/></marker>
  </defs>
  <text x="440.0" y="28" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Directional coupler, Wilkinson divider, circulator</text>
  <text x="150" y="62" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="12" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Directional coupler</text>
  <line x1="40" y1="100" x2="260" y2="100" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <line x1="40" y1="160" x2="260" y2="160" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <line x1="90" y1="100" x2="90" y2="160" stroke="#1a1a1a" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 3"/>
  <line x1="210" y1="100" x2="210" y2="160" stroke="#1a1a1a" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 3"/>
  <text x="44" y="92" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="9.5" text-anchor="start" fill="#c0392b" font-weight="bold">1 IN</text>
  <text x="256" y="92" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="9.5" text-anchor="end" fill="#c0392b" font-weight="bold">2 OUT</text>
  <text x="44" y="178" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="9.5" text-anchor="start" fill="#0072B2" font-weight="normal">4 ISO</text>
  <text x="256" y="178" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="9.5" text-anchor="end" fill="#0072B2" font-weight="normal">3 CPL</text>
  <text x="150" y="210" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="9.6" text-anchor="middle" fill="#444" font-weight="normal">coupling  C = P1 / P3   (e.g. 20 dB)</text>
  <text x="150" y="226" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="9.6" text-anchor="middle" fill="#444" font-weight="normal">directivity D = P3 / P4  (higher = better)</text>
  <text x="150" y="242" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="9.6" text-anchor="middle" fill="#444" font-weight="normal">isolation  I = C + D</text>
  <text x="470" y="62" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="12" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Wilkinson divider</text>
  <line x1="350" y1="130" x2="410" y2="130" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <path d="M 410 130 L 460 100 L 530 100" fill="none" stroke="#1a1a1a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 410 130 L 460 160 L 530 160" fill="none" stroke="#1a1a1a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="444" y="88" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="8.6" text-anchor="middle" fill="#666" font-weight="normal">quarter-wave, 70.7 ohm</text>
  <text x="444" y="182" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="8.6" text-anchor="middle" fill="#666" font-weight="normal">quarter-wave, 70.7 ohm</text>
  <line x1="530" y1="100" x2="530" y2="118" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <line x1="530" y1="142" x2="530" y2="160" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <rect x="514" y="118" width="32" height="24" rx="0" fill="#FDF0EE" stroke="#c0392b" stroke-width="2"/>
  <text x="530" y="134" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="9" text-anchor="middle" fill="#c0392b" font-weight="bold">100</text>
  <line x1="546" y1="100" x2="590" y2="100" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <line x1="546" y1="160" x2="590" y2="160" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <text x="352" y="122" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="9.5" text-anchor="start" fill="#c0392b" font-weight="bold">IN</text>
  <text x="588" y="92" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="9.5" text-anchor="end" fill="#1a1a1a" font-weight="normal">OUT 1</text>
  <text x="588" y="182" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="9.5" text-anchor="end" fill="#1a1a1a" font-weight="normal">OUT 2</text>
  <text x="470" y="210" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="9.6" text-anchor="middle" fill="#444" font-weight="normal">-3 dB each, all ports matched,</text>
  <text x="470" y="226" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="9.6" text-anchor="middle" fill="#444" font-weight="normal">output ports ISOLATED by the 100 ohm resistor</text>
  <text x="470" y="242" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="9.6" text-anchor="middle" fill="#c0392b" font-weight="normal">(without it, they would just be a T junction)</text>
  <text x="760" y="62" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="12" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Circulator</text>
  <circle cx="760" cy="130" r="44" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M 740 144 A 24 24 0 1 1 780 144" fill="none" stroke="#1a1a1a" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 773 138 L 780 146 L 787 135" fill="none" stroke="#1a1a1a" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="680" y1="130" x2="716" y2="130" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <line x1="804" y1="130" x2="840" y2="130" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <line x1="760" y1="174" x2="760" y2="206" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <text x="684" y="122" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="10" text-anchor="start" fill="#1a1a1a" font-weight="bold">1</text>
  <text x="836" y="122" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="10" text-anchor="end" fill="#1a1a1a" font-weight="bold">2</text>
  <text x="770" y="202" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="10" text-anchor="start" fill="#1a1a1a" font-weight="bold">3</text>
  <text x="760" y="226" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="9.6" text-anchor="middle" fill="#444" font-weight="normal">1 -> 2 -> 3 -> 1 only</text>
  <text x="760" y="242" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="9.6" text-anchor="middle" fill="#444" font-weight="normal">terminate port 3 = isolator</text>
  <rect x="30" y="280" width="820" height="84" rx="6" fill="#F4F7FA" stroke="#1a1a1a" stroke-width="1.8"/>
  <text x="46" y="300" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="11" text-anchor="start" fill="#1a1a1a" font-weight="bold">WHY THESE MATTER FOR MEASUREMENT:</text>
  <text x="46" y="320" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="10" text-anchor="start" fill="#1a1a1a" font-weight="normal">Coupler: watch a transmitter output without loading it. Directivity limits how well you can separate forward and reverse waves.</text>
  <text x="46" y="338" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="10" text-anchor="start" fill="#1a1a1a" font-weight="normal">Divider: split one source into two paths that stay isolated from each other (two-tone test - see M15).</text>
  <text x="46" y="356" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="10" text-anchor="start" fill="#1a1a1a" font-weight="normal">Circulator / isolator: protect a source from reflected power, or separate TX and RX on one antenna.</text>
</svg>
