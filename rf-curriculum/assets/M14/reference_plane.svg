<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="430" viewBox="0 0 1020 430" font-family="Helvetica,Arial,sans-serif"><title>기준면 이동 - 포트 익스텐션과 디임베딩</title><rect width="1020" height="430" fill="white"/>
<defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker></defs>
<text x="510.0" y="32" font-size="16" fill="#1A1A1A" text-anchor="middle" font-weight="bold" font-style="normal">Where is the reference plane?</text>
<text x="40" y="116" font-size="12.5" fill="#7F7F7F" text-anchor="start" font-weight="bold" font-style="normal">after calibration</text>
<line x1="200" y1="110" x2="300" y2="110" stroke="#1A1A1A" stroke-width="2.4" fill="none"/>
<rect x="300" y="90" width="130" height="40" rx="3" fill="#EDEDED" stroke="#1A1A1A" stroke-width="1.5"/>
<text x="365" y="115" font-size="11" fill="#1A1A1A" text-anchor="middle" font-weight="normal" font-style="normal">FIXTURE</text>
<line x1="430" y1="110" x2="500" y2="110" stroke="#1A1A1A" stroke-width="2.4" fill="none"/>
<rect x="500" y="86" width="110" height="48" rx="4" fill="white" stroke="#0072B2" stroke-width="2"/>
<text x="555" y="115" font-size="13" fill="#1A1A1A" text-anchor="middle" font-weight="bold" font-style="normal">DUT</text>
<line x1="610" y1="110" x2="690" y2="110" stroke="#1A1A1A" stroke-width="2.4" fill="none"/>
<line x1="300" y1="66" x2="300" y2="154" stroke="#7F7F7F" stroke-width="2.6" fill="none" stroke-dasharray="6 4"/>
<text x="300" y="58" font-size="10" fill="#7F7F7F" text-anchor="middle" font-weight="bold" font-style="normal">reference plane</text>
<text x="700" y="115" font-size="10" fill="#7F7F7F" text-anchor="start" font-weight="normal" font-style="normal">plane sits at the cal standards</text>
<text x="40" y="226" font-size="12.5" fill="#D55E00" text-anchor="start" font-weight="bold" font-style="normal">port extension</text>
<line x1="200" y1="220" x2="300" y2="220" stroke="#1A1A1A" stroke-width="2.4" fill="none"/>
<rect x="300" y="200" width="130" height="40" rx="3" fill="#EDEDED" stroke="#1A1A1A" stroke-width="1.5"/>
<text x="365" y="225" font-size="11" fill="#1A1A1A" text-anchor="middle" font-weight="normal" font-style="normal">FIXTURE</text>
<line x1="430" y1="220" x2="500" y2="220" stroke="#1A1A1A" stroke-width="2.4" fill="none"/>
<rect x="500" y="196" width="110" height="48" rx="4" fill="white" stroke="#0072B2" stroke-width="2"/>
<text x="555" y="225" font-size="13" fill="#1A1A1A" text-anchor="middle" font-weight="bold" font-style="normal">DUT</text>
<line x1="610" y1="220" x2="690" y2="220" stroke="#1A1A1A" stroke-width="2.4" fill="none"/>
<line x1="500" y1="176" x2="500" y2="264" stroke="#D55E00" stroke-width="2.6" fill="none" stroke-dasharray="6 4"/>
<text x="500" y="168" font-size="10" fill="#D55E00" text-anchor="middle" font-weight="bold" font-style="normal">reference plane</text>
<text x="700" y="225" font-size="10" fill="#7F7F7F" text-anchor="start" font-weight="normal" font-style="normal">delay only - loss and mismatch stay</text>
<text x="40" y="336" font-size="12.5" fill="#009E73" text-anchor="start" font-weight="bold" font-style="normal">de-embedding</text>
<line x1="200" y1="330" x2="300" y2="330" stroke="#1A1A1A" stroke-width="2.4" fill="none"/>
<rect x="300" y="310" width="130" height="40" rx="3" fill="#EDEDED" stroke="#1A1A1A" stroke-width="1.5"/>
<text x="365" y="335" font-size="11" fill="#1A1A1A" text-anchor="middle" font-weight="normal" font-style="normal">FIXTURE</text>
<line x1="430" y1="330" x2="500" y2="330" stroke="#1A1A1A" stroke-width="2.4" fill="none"/>
<rect x="500" y="306" width="110" height="48" rx="4" fill="white" stroke="#0072B2" stroke-width="2"/>
<text x="555" y="335" font-size="13" fill="#1A1A1A" text-anchor="middle" font-weight="bold" font-style="normal">DUT</text>
<line x1="610" y1="330" x2="690" y2="330" stroke="#1A1A1A" stroke-width="2.4" fill="none"/>
<line x1="500" y1="286" x2="500" y2="374" stroke="#009E73" stroke-width="2.6" fill="none" stroke-dasharray="6 4"/>
<text x="500" y="278" font-size="10" fill="#009E73" text-anchor="middle" font-weight="bold" font-style="normal">reference plane</text>
<text x="700" y="335" font-size="10" fill="#7F7F7F" text-anchor="start" font-weight="normal" font-style="normal">the whole fixture is removed</text>
<text x="40" y="404" font-size="11" fill="#C0392B" text-anchor="start" font-weight="normal" font-style="normal">quick test: extend the port, then measure a SHORT at the DUT plane.  If it is not 180 deg +/- 2, extension was not enough.</text>
</svg>