<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 280" width="660" height="280" role="img" aria-label="2포트 회로망의 진행파 정의: 입사파 a와 반사파 b, 그리고 S-파라미터">
  <title>2포트 회로망의 진행파 정의: 입사파 a와 반사파 b, 그리고 S-파라미터</title>
  <rect width="660" height="280" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0072B2"/>
    </marker>
  </defs>
  <text x="330" y="26" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold" font-style="normal">Two-port network: incident and reflected waves</text>
  <rect x="230" y="80" width="200" height="110" rx="6" fill="#F4F7FA" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="330.0" y="132" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="20" text-anchor="middle" fill="#1a1a1a" font-weight="bold" font-style="normal">DUT</text>
  <text x="330.0" y="156" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="11" text-anchor="middle" fill="#666" font-weight="normal" font-style="normal">2-port</text>
  <line x1="60" y1="120" x2="230" y2="120" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <line x1="430" y1="120" x2="600" y2="120" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <text x="60" y="76" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="12" text-anchor="start" fill="#1a1a1a" font-weight="bold" font-style="normal">Port 1</text>
  <text x="600" y="76" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="12" text-anchor="end" fill="#1a1a1a" font-weight="bold" font-style="normal">Port 2</text>
  <path d="M 80 94 L 200 94" fill="none" stroke="#c0392b" stroke-width="2.4" marker-end="url(#ah)"/>
  <text x="140" y="84" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="11" text-anchor="middle" fill="#c0392b" font-weight="bold" font-style="normal">a1  incident</text>
  <path d="M 200 150 L 80 150" fill="none" stroke="#0072B2" stroke-width="2.4" marker-end="url(#ab)"/>
  <text x="140" y="168" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="11" text-anchor="middle" fill="#0072B2" font-weight="bold" font-style="normal">b1  reflected</text>
  <path d="M 460 150 L 580 150" fill="none" stroke="#0072B2" stroke-width="2.4" marker-end="url(#ab)"/>
  <text x="520" y="168" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="11" text-anchor="middle" fill="#0072B2" font-weight="bold" font-style="normal">b2  transmitted</text>
  <path d="M 580 94 L 460 94" fill="none" stroke="#c0392b" stroke-width="2.4" marker-end="url(#ah)"/>
  <text x="520" y="84" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="11" text-anchor="middle" fill="#c0392b" font-weight="bold" font-style="normal">a2  incident</text>
  <text x="180" y="240" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="bold" font-style="normal">b1 = S11 a1 + S12 a2</text>
  <text x="480" y="240" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="bold" font-style="normal">b2 = S21 a1 + S22 a2</text>
  <text x="330" y="262" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="10" text-anchor="middle" fill="#666" font-weight="normal" font-style="normal">S11 = b1/a1  and  S21 = b2/a1   are measured with  a2 = 0 (port 2 terminated in Z0)</text>
</svg>
