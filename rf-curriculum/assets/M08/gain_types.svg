  <line x1="550" y1="76" x2="550" y2="116" stroke="#0072B2" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 3"/>
  <rect x="52" y="188" width="796" height="218" rx="8" fill="#FCFCFD" stroke="#DDD" stroke-width="1.4"/>
  <text x="66" y="206" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="11" text-anchor="start" fill="#1a1a1a" font-weight="bold">Name</text>
  <text x="250" y="206" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="11" text-anchor="start" fill="#1a1a1a" font-weight="bold">Definition</text>
  <text x="556" y="206" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="11" text-anchor="start" fill="#1a1a1a" font-weight="bold">When you use it</text>
  <line x1="60" y1="220" x2="840" y2="220" stroke="#E6E6E6" stroke-width="1" stroke-linecap="round"/>
  <text x="66" y="240" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="10.5" text-anchor="start" fill="#1a1a1a" font-weight="bold">Transducer  GT</text>
  <text x="250" y="240" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="9.6" text-anchor="start" fill="#1a1a1a" font-weight="normal">power delivered to load / power AVAILABLE from source</text>
  <text x="556" y="240" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="9.6" text-anchor="start" fill="#555" font-weight="normal">both ends mismatched - the honest, real-world number</text>
  <line x1="60" y1="266" x2="840" y2="266" stroke="#E6E6E6" stroke-width="1" stroke-linecap="round"/>
  <text x="66" y="286" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="10.5" text-anchor="start" fill="#009E73" font-weight="bold">Available  GA</text>
  <text x="250" y="286" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="9.6" text-anchor="start" fill="#1a1a1a" font-weight="normal">power available from network / power available from source</text>
  <text x="556" y="286" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="9.6" text-anchor="start" fill="#555" font-weight="normal">depends on Gs only - used for NOISE and LNA design</text>
  <line x1="60" y1="312" x2="840" y2="312" stroke="#E6E6E6" stroke-width="1" stroke-linecap="round"/>
  <text x="66" y="332" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="10.5" text-anchor="start" fill="#c0392b" font-weight="bold">Operating (power)  GP</text>
  <text x="250" y="332" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="9.6" text-anchor="start" fill="#1a1a1a" font-weight="normal">power delivered to load / power INPUT to the network</text>
  <text x="556" y="332" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="9.6" text-anchor="start" fill="#555" font-weight="normal">depends on GL only - used for PA / output design</text>
  <line x1="60" y1="358" x2="840" y2="358" stroke="#E6E6E6" stroke-width="1" stroke-linecap="round"/>
  <text x="66" y="378" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="10.5" text-anchor="start" fill="#0072B2" font-weight="bold">Maximum available  MAG</text>
  <text x="250" y="378" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="9.6" text-anchor="start" fill="#1a1a1a" font-weight="normal">GT when both ends are conjugate-matched (needs K > 1)</text>
  <text x="556" y="378" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="9.6" text-anchor="start" fill="#555" font-weight="normal">the ceiling - a single number in the datasheet</text>
  <text x="450.0" y="438" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="10.5" text-anchor="middle" fill="#c0392b" font-weight="bold">All four are equal only when BOTH ends are conjugate-matched.</text>
  <text x="450.0" y="458" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="9.6" text-anchor="middle" fill="#555" font-weight="normal">G in this figure means Gamma - the reflection coefficient looking in that direction.</text>
