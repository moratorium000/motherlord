  <text x="391.0" y="62" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="10.5" text-anchor="middle" fill="#009E73" font-weight="bold">Gout</text>
  <line x1="404" y1="76" x2="404" y2="116" stroke="#009E73" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 3"/>
  <path d="M 550 70 L 576 70" fill="none" stroke="#0072B2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ab)"/>
