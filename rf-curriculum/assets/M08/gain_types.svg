  <text x="608" y="90" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="11" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Load</text>
  <text x="624" y="128" font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size="11" text-anchor="start" fill="#c0392b" font-weight="normal">ZL</text>
